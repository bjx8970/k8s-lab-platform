{% extends "base.html" %}
{% block page_heading %}我的集群{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="/static/css/pages/student.css">
{% endblock %}
{% block content %}

<div id="student-clusters-section"></div>

<div id="terminal-overlay" class="d-none">
    <div id="terminal-container">
        <div id="terminal-header">
            <span id="terminal-title">Web终端</span>
            <span id="terminal-status"></span>
            <span id="takeover-indicator" class="d-none">教师正在操作</span>
            <button id="request-reconnect-btn" class="ssh-btn-request d-none" onclick="requestReconnectFromTerminal()">请求恢复</button>
            <span id="student-reconnect-countdown" class="d-none"></span>
            <span style="flex:1"></span>
            <button id="terminal-fullscreen" onclick="toggleTerminalFullscreen()" title="全屏">&#9974;</button>
            <button id="terminal-close" onclick="closeTerminal()" title="断开">&#10005;</button>
        </div>
        <div id="terminal-body"></div>
    </div>
</div>

<div class="modal-overlay" id="shutdown-vote-modal" style="z-index:10000">
    <div class="modal-card" style="max-width:520px;padding:32px 36px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
            <span id="shutdown-vote-icon" style="font-size:24px">&#9888;&#65039;</span>
            <h3 id="shutdown-vote-title" style="margin:0;font-size:20px;font-weight:600">关机确认</h3>
        </div>
        <p id="shutdown-vote-message" style="font-size:14px;color:#555;line-height:1.7;margin:0 0 16px"></p>
        <div id="shutdown-vote-vm-section" style="background:#f6f8fa;border:1px solid #e8eaed;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;display:none"></div>
        <div id="shutdown-vote-cluster-warning" style="background:#fff2f0;border:1px solid #ffccc7;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#cf1322;display:none">
            <strong>&#9888;&#65039; 集群关机提醒：</strong>此操作将关闭该集群的<b>全部节点</b>，请确认
        </div>
        <div style="text-align:center">
            <div id="shutdown-vote-countdown" style="font-size:36px;font-weight:700;color:#1890ff;margin:12px 0 8px">30s</div>
            <div style="height:4px;background:#e8eaed;border-radius:2px;margin:0 0 16px;overflow:hidden">
                <div id="shutdown-vote-bar-fill" style="height:100%;width:100%;background:#1890ff;border-radius:2px;transition:width 1s linear"></div>
            </div>
        </div>
        <div id="shutdown-vote-actions" style="display:none;gap:12px;justify-content:center;margin-top:8px">
            <button class="btn btn-primary" onclick="castShutdownVote(true)" style="min-width:120px;padding:10px 24px;font-size:15px">&#10003; 同意关机</button>
            <button class="btn btn-danger" onclick="castShutdownVote(false)" style="min-width:120px;padding:10px 24px;font-size:15px">&#10007; 拒绝</button>
        </div>
        <div id="shutdown-vote-pending" style="display:none;margin-top:8px;text-align:center">
            <p style="color:#888;margin-bottom:12px;font-size:14px">等待中... 已同意: <strong id="shutdown-vote-agreed-count" style="color:#1890ff">1</strong>/<span id="shutdown-vote-total-count">0</span></p>
            <button class="btn" onclick="cancelShutdownVote()" style="border-color:#999;color:#666;padding:8px 20px">取消操作</button>
        </div>
        <div id="shutdown-vote-waiting" style="display:none;margin-top:8px;text-align:center">
            <p style="color:#888;font-size:14px">已投票，等待其他同学...</p>
        </div>
    </div>
</div>

<script src="/static/vendor/socket.io/socket.io.min.js"></script>
<link rel="stylesheet" href="/static/vendor/xterm/xterm.min.css">
<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm/xterm-addon-fit.js"></script>

<script>
var vmStatusCache = {};
var terminalSocket = null;
var terminal = null;
var fitAddon = null;
var currentClusterName = null;
var currentSessionId = null;
var terminalConnected = false;
var isTakenOver = false;
var countdownTimer = null;
var studentCountdownTimer = null;
var clusterSessionStates = {};
var _labelMap = {'pending':'未部署','installing':'部署中','installed':'已部署','failed':'部署失败'};

var shutdownVoteId = null;
var shutdownVoteTimer = null;
var shutdownVoteInitiated = false;

function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setTerminalStatus(cls) {
  var el = document.getElementById('terminal-status');
  if (el._ls) el.classList.remove(el._ls);
  if (cls) el.classList.add(cls);
  el._ls = cls;
}

async function _doVmAction(node, vmid, action) {
    try {
        var r = await fetch('/api/pve/vms/' + encodeURIComponent(node) + '/' + vmid + '/' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
        });
        var d = await r.json();
        if (!r.ok) throw new Error(d.error || '操作失败');
        var _key = node + '_' + vmid;
        var _st = action === 'start' ? 'running' : 'stopped';
        vmStatusCache[_key] = _st;
        document.querySelectorAll('[id$="-' + vmid + '"]').forEach(function(_el) {
            if (_el.classList.contains('vm-tag')) _el.className = 'vm-tag' + (_st === 'running' ? ' vm-running' : ' vm-stopped');
        });
        showToast(action === 'start' ? '已启动' : '已停止', 'success');
    } catch (e) {
        showToast('操作失败: ' + e.message, 'error');
    }
}

async function vmAction(node, vmid, action, clusterName) {
    if (action === 'stop' && clusterName) {
        if (!await showConfirm('确定停止该虚拟机？')) return;
        stateSocket.emit('vm_shutdown_initiate', {
            node: node,
            vmid: vmid,
            cluster_name: clusterName,
        });
        return;
    }
    return _doVmAction(node, vmid, action);
}

async function clusterVmAction(clusterName, action) {
    var actionMsg = action === 'start' ? '启动' : '停止';
    if (!await showConfirm('确定' + actionMsg + '集群 ' + clusterName + ' 的所有虚拟机？')) return;
    if (action === 'start') {
        try {
            var r = await fetch('/api/k8s/clusters/' + encodeURIComponent(clusterName) + '/vm-action-all', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: 'start'}),
            });
            var d = await r.json();
            if (!r.ok) throw new Error(d.error || '启动失败');
            showToast('已启动全部节点', 'success');
            loadMyClusters();
        } catch (e) { showToast('启动失败: ' + e.message, 'error'); }
        return;
    }
    stateSocket.emit('vm_shutdown_cluster_initiate', {
        cluster_name: clusterName,
    });
}

function showShutdownModal(title, msg, showActions, showPending, showWaiting, voteType, vmName, vmList) {
    document.getElementById('shutdown-vote-title').textContent = title || '关机确认';
    document.getElementById('shutdown-vote-message').innerHTML = msg || '';
    document.getElementById('shutdown-vote-actions').style.display = showActions ? 'flex' : 'none';
    document.getElementById('shutdown-vote-pending').style.display = showPending ? 'block' : 'none';
    document.getElementById('shutdown-vote-waiting').style.display = showWaiting ? 'block' : 'none';
    document.getElementById('shutdown-vote-icon').textContent = voteType === 'cluster' ? '\u{1F6A8}' : '\u26A0\uFE0F';
    var vmSection = document.getElementById('shutdown-vote-vm-section');
    var clusterWarn = document.getElementById('shutdown-vote-cluster-warning');
    if (voteType === 'cluster') {
        vmSection.style.display = 'block';
        vmSection.style.borderColor = '#ffccc7';
        vmSection.style.background = '#fff2f0';
        var vmHtml = '<div style="font-weight:500;color:#cf1322;margin-bottom:8px">\u26A1 以下 ' + (vmList ? vmList.length : 0) + ' 个节点将被关闭：</div>';
        if (vmList && vmList.length) {
            vmHtml += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
            for (var vi = 0; vi < vmList.length; vi++) {
                vmHtml += '<span style="background:#fff;border:1px solid #ffccc7;border-radius:4px;padding:4px 10px;font-size:12px;color:#555">' + esc(vmList[vi]) + '</span>';
            }
            vmHtml += '</div>';
        }
        vmSection.innerHTML = vmHtml;
        clusterWarn.style.display = 'block';
    } else {
        vmSection.style.display = 'block';
        vmSection.style.borderColor = '#91d5ff';
        vmSection.style.background = '#e6f7ff';
        vmSection.innerHTML = '<span style="font-weight:500;color:#1890ff">\uD83D\uDCBB ' + esc(vmName || '虚拟机') + '</span>';
        clusterWarn.style.display = 'none';
    }
    document.getElementById('shutdown-vote-modal').className = 'modal-overlay show';
}

function hideShutdownModal() {
    document.getElementById('shutdown-vote-modal').className = 'modal-overlay';
    shutdownVoteId = null;
    if (shutdownVoteTimer) { clearInterval(shutdownVoteTimer); shutdownVoteTimer = null; }
}

function updateShutdownCountdown(remaining) {
    var cd = document.getElementById('shutdown-vote-countdown');
    if (cd) cd.textContent = remaining + 's';
    var fill = document.getElementById('shutdown-vote-bar-fill');
    if (fill) fill.style.width = Math.max(0, (remaining / 30) * 100) + '%';
}

function castShutdownVote(agree) {
    if (!shutdownVoteId) return;
    stateSocket.emit('vm_shutdown_vote', {vote_id: shutdownVoteId, agree: agree});
    hideShutdownModal();
    if (agree) {
        showToast('已同意关机，等待其他同学...', 'info');
    }
}

function cancelShutdownVote() {
    if (!shutdownVoteId) return;
    stateSocket.emit('vm_shutdown_cancel', {vote_id: shutdownVoteId});
    hideShutdownModal();
    showToast('已取消关机操作', 'info');
}

async function refreshVmStatuses(clusters) {
    var vmList = [];
    var vmMap = {};
    for (var cname in clusters) {
        var c = clusters[cname];
        if (!c.vms) continue;
        for (var vn in c.vms) {
            var vm = c.vms[vn];
            var el = document.getElementById('vm-' + cname + '-' + vm.vmid);
            if (!el) continue;
            var key = vm.node + '_' + vm.vmid;
            vmList.push({node: vm.node, vmid: vm.vmid});
            vmMap[key] = el;
        }
    }
    if (!vmList.length) return;
    try {
        var res = await fetch('/api/pve/vms/status/batch', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({vms: vmList}),
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'batch failed');
        for (var key in (data.statuses || {})) {
            var st = data.statuses[key];
            var el = vmMap[key];
            vmStatusCache[key] = st.status;
            if (el) el.className = 'vm-tag' + (st.status === 'running' ? ' vm-running' : ' vm-stopped');
        }
    } catch(e) {
        for (var k in vmMap) { vmMap[k].className = 'vm-tag vm-stopped'; }
    }
}

async function loadMyClusters() {
    try {
        var r = await fetch('/api/k8s/clusters');
        var clusters = await r.json();
        await loadSessionStates(clusters);
        renderCards(clusters);
        refreshVmStatuses(clusters);
    } catch (e) {
        document.getElementById('student-clusters-section').innerHTML = '<div class="card"><p class="text-danger">加载失败: ' + esc(e.message) + '</p></div>';
    }
}

async function loadSessionStates(clusters) {
    clusterSessionStates = {};
    try {
        var r = await fetch('/api/webssh/my-sessions');
        var d = await r.json();
        for (var i = 0; i < (d.sessions || []).length; i++) {
            var s = d.sessions[i];
            if (s.cluster_name && s.status !== 'terminated') {
                clusterSessionStates[s.cluster_name] = s;
            }
        }
    } catch(e) {}
}

function renderCards(clusters) {
    var keys = Object.keys(clusters);
    if (keys.length === 0) {
        document.getElementById('student-clusters-section').innerHTML = '<div class="card"><p class="text-center text-gray" style="padding:40px 0">暂无集群</p></div>';
        return;
    }

    var grouped = {};
    var classOrder = [];
    for (var ni = 0; ni < keys.length; ni++) {
        var name = keys[ni];
        var c = clusters[name];
        var key = c.class_name || '其他课程';
        if (!grouped[key]) { grouped[key] = []; classOrder.push(key); }
        grouped[key].push({name: name, data: c});
    }

    var html = '';
    for (var ci = 0; ci < classOrder.length; ci++) {
        var clsName = classOrder[ci];
        var items = grouped[clsName];
        html += '<div class="card mb-4">' +
            '<h3 class="mb-3 fs-16">&#128218; ' + esc(clsName) + ' (' + items.length + ' 个集群)</h3>';

        for (var ii = 0; ii < items.length; ii++) {
            var c = items[ii].data;
            var cname = items[ii].name;
            var label = c.group_name || '集群';
            var sshInfo = '<div class="cluster-ssh" id="ssh-info-' + esc(cname) + '"></div>';

            var vmsHtml = '';
            if (c.vms) {
                for (var vn in c.vms) {
                    var v = c.vms[vn];
                    var _key = v.node + '_' + v.vmid;
                    var _cached = vmStatusCache[_key];
                    var _extra = _cached === 'running' ? ' vm-running' : (_cached === 'stopped' ? ' vm-stopped' : '');
                    vmsHtml += '<span class="vm-tag' + _extra + '" id="vm-' + esc(cname) + '-' + v.vmid + '">' +
                        esc(vn) + ' (' + v.role + ')' +
                        '<button class="vm-btn" onclick="event.stopPropagation();vmAction(\'' + esc(v.node) + '\',' + v.vmid + ',\'start\')">&#9654;</button>' +
                        '<button class="vm-btn" onclick="event.stopPropagation();vmAction(\'' + esc(v.node) + '\',' + v.vmid + ',\'stop\',\'' + esc(cname) + '\')">&#9209;</button>' +
                        '</span>';
                }
            }

            var btnHtml = renderSessionButtons(cname, c);

            var k8s = c.k8s_status || 'pending';
            var k8sLabel = _labelMap[k8s] || k8s;
            var k8sBadge = '<span class="k8s-badge k8s-' + k8s + '">' + k8sLabel + '</span>';

            html += '<div class="cluster-item">' +
                '<div class="cluster-header cluster-header--space-between">' +
                    '<span class="cluster-name">' + esc(label) + '</span>' +
                    k8sBadge +
                '</div>' +
                '<div class="cluster-action-bar">' +
                    btnHtml +
                    '<button class="btn btn-sm btn-success" onclick="clusterVmAction(\'' + cname + '\',\'start\')">&#9654; 启动全部</button>' +
                    '<button class="btn btn-sm btn-danger" onclick="clusterVmAction(\'' + cname + '\',\'stop\')">&#9209; 停止全部</button>' +
                    '<button class="view-ssh-btn" onclick="toggleSshInfo(\'' + esc(cname) + '\')">&#128274; 查看连接信息</button>' +
                '</div>' +
                sshInfo +
                (vmsHtml ? '<div class="cluster-vms">' + vmsHtml + '</div>' : '') +
            '</div>';
        }
        html += '</div>';
    }
    document.getElementById('student-clusters-section').innerHTML = html;
}

function renderSessionButtons(clusterName, clusterData) {
    var session = clusterSessionStates[clusterName];
    if (!session || session.status === 'terminated') {
        return '<button class="ssh-btn" onclick="createSession(\'' + esc(clusterName) + '\')">连接</button>';
    }

    var buttons = '<button class="ssh-btn-reconnect" onclick="reconnectSession(\'' + esc(clusterName) + '\')">打开终端</button>';

    if (session.takeover_active) {
        var taker = session.takeover_by ? session.takeover_by.username : '';
        buttons += '<span class="ssh-takeover-notice">教师 ' + esc(taker) + ' 正在操作</span>';
    }

    buttons += '<button class="ssh-btn-terminate" onclick="terminateSession(\'' + esc(clusterName) + '\')">终止会话</button>';
    return buttons;
}

function toggleSshInfo(clusterName) {
    var el = document.getElementById('ssh-info-' + clusterName);
    if (!el) return;
    el.classList.toggle('show');
}

async function createSession(clusterName) {
    initTerminal();
    currentClusterName = clusterName;
    document.getElementById('terminal-overlay').classList.remove('d-none');
    document.getElementById('terminal-title').textContent = 'Web终端 - ' + clusterName;
    document.getElementById('terminal-status').textContent = '连接中...';
    setTerminalStatus('terminal-status-connecting');
    document.getElementById('takeover-indicator').classList.add('d-none');
    isTakenOver = false;
    setTimeout(function() { fitAddon.fit(); }, 100);

    if (!terminalSocket) {
        initSocket();
    }

    terminalSocket.emit('session_create', {cluster: clusterName});
}

async function reconnectSession(clusterName) {
    initTerminal();
    currentClusterName = clusterName;
    document.getElementById('terminal-overlay').classList.remove('d-none');
    document.getElementById('terminal-title').textContent = 'Web终端 - ' + clusterName;
    document.getElementById('terminal-status').textContent = '重新连接中...';
    setTerminalStatus('terminal-status-connecting');
    document.getElementById('takeover-indicator').classList.add('d-none');
    isTakenOver = false;
    setTimeout(function() { fitAddon.fit(); }, 100);

    if (!terminalSocket) {
        initSocket();
    }

    terminalSocket.emit('session_reconnect', {cluster: clusterName});
}

async function terminateSession(clusterName) {
    if (!await showConfirm('确定终止该会话？SSH 连接将被关闭。')) return;
    try {
        var r = await fetch('/api/webssh/sessions/' + encodeURIComponent(clusterName) + '/terminate', {
            method: 'POST',
        });
        var d = await r.json();
        if (!r.ok) throw new Error(d.error || '终止失败');
        delete clusterSessionStates[clusterName];
        loadMyClusters();
        showToast('会话已终止', 'success');
    } catch(e) {
        showToast('终止失败: ' + e.message, 'error');
    }
}

async function requestReconnect(sessionId, clusterName) {
    if (!terminalSocket) return;
    terminalSocket.emit('reconnect_request', {session_id: sessionId});
    showToast('已发送恢复请求', 'info');
    showStudentReconnectCountdown();
}

function requestReconnectFromTerminal() {
    if (currentSessionId && currentClusterName && terminalSocket) {
        requestReconnect(currentSessionId, currentClusterName);
    }
}

function showStudentReconnectCountdown() {
    var countdownEl = document.getElementById('student-reconnect-countdown');
    var btn = document.getElementById('request-reconnect-btn');
    if (!countdownEl) return;
    if (btn) btn.classList.add('d-none');
    var seconds = 10;
    countdownEl.textContent = '正在请求恢复 (' + seconds + '秒)';
    countdownEl.classList.remove('d-none');
    if (studentCountdownTimer) clearInterval(studentCountdownTimer);
    studentCountdownTimer = setInterval(function() {
        seconds--;
        if (seconds > 0) {
            countdownEl.textContent = '正在请求恢复 (' + seconds + '秒)';
        } else if (seconds === 0) {
            countdownEl.textContent = '等待恢复...';
        }
        if (seconds <= 0) {
            clearInterval(studentCountdownTimer);
            studentCountdownTimer = null;
        }
    }, 1000);
}

function hideStudentReconnectCountdown() {
    var countdownEl = document.getElementById('student-reconnect-countdown');
    if (countdownEl) countdownEl.classList.add('d-none');
    if (studentCountdownTimer) { clearInterval(studentCountdownTimer); studentCountdownTimer = null; }
}

function initSocket() {
    terminalSocket = io('/webssh', {
        reconnection: true,
        reconnectionAttempts: 3,
        reconnectionDelay: 1000,
    });

    terminalSocket.on('connect', function() {
        if (currentClusterName && currentSessionId) {
            terminalSocket.emit('session_reconnect', {cluster: currentClusterName});
        }
    });

    function syncTerminalSize() {
        setTimeout(function() {
            if (!fitAddon || !terminal) return;
            fitAddon.fit();
            var dims = fitAddon.proposeDimensions();
            if (dims && terminalSocket && terminalSocket.connected) {
                terminalSocket.emit('ssh_resize', {cols: dims.cols, rows: dims.rows});
            }
        }, 200);
    }

    terminalSocket.on('session_created', function(data) {
        currentSessionId = data.session_id;
        terminalConnected = true;
        document.getElementById('terminal-status').textContent = '已连接';
        setTerminalStatus('terminal-status-connected');
        terminal.writeln('\x1b[32m已连接到 ' + data.cluster + '\x1b[0m\r\n');
        syncTerminalSize();
    });

    terminalSocket.on('session_reconnected', function(data) {
        currentSessionId = data.session_id;
        terminalConnected = true;
        document.getElementById('terminal-status').textContent = '已连接';
        setTerminalStatus('terminal-status-connected');
        syncTerminalSize();
    });

    terminalSocket.on('log_replay', function(data) {
        if (terminal && data.lines) {
            terminal.write(data.lines);
        }
    });

    terminalSocket.on('session_terminated', function(data) {
        delete clusterSessionStates[data.cluster];
        if (data.cluster === currentClusterName) {
            terminal.writeln('\r\n\x1b[33m会话已终止\x1b[0m\r\n');
            document.getElementById('terminal-status').textContent = '已终止';
            setTerminalStatus('terminal-status-error');
        }
        loadMyClusters();
    });

    terminalSocket.on('ssh_output', function(data) {
        if (terminal) terminal.write(data.data);
    });

    terminalSocket.on('ssh_error', function(data) {
        terminalConnected = false;
        document.getElementById('terminal-status').textContent = '错误';
        setTerminalStatus('terminal-status-error');
        if (terminal) terminal.writeln('\x1b[31m' + (data.message || '连接失败') + '\x1b[0m\r\n');
    });

    terminalSocket.on('ssh_disconnected', function(data) {
        terminalConnected = false;
        document.getElementById('terminal-status').textContent = '已断开';
        setTerminalStatus('terminal-status-error');
        if (terminal) terminal.writeln('\r\n\x1b[33m' + (data.reason || '连接已断开') + '\x1b[0m\r\n');
    });

    terminalSocket.on('takeover_notify', function(data) {
        isTakenOver = true;
        document.getElementById('takeover-indicator').classList.remove('d-none');
        document.getElementById('request-reconnect-btn').classList.remove('d-none');
        document.getElementById('takeover-indicator').textContent = '教师 ' + (data.by || '') + ' 正在操作';
        showToast('教师 ' + (data.by || '') + ' 正在操作您的终端', 'warning');
    });

    terminalSocket.on('takeover_released', function() {
        isTakenOver = false;
        document.getElementById('takeover-indicator').classList.add('d-none');
        document.getElementById('request-reconnect-btn').classList.add('d-none');
        hideStudentReconnectCountdown();
        showToast('教师已释放终端', 'success');
    });

    terminalSocket.on('reconnect_request_notify', function() {
    });

    terminalSocket.on('reconnect_requested', function(data) {
        showStudentReconnectCountdown();
    });

    terminalSocket.on('reconnect_response', function(data) {
        hideStudentReconnectCountdown();
        if (data.accepted) {
            isTakenOver = false;
            document.getElementById('takeover-indicator').classList.add('d-none');
            document.getElementById('request-reconnect-btn').classList.add('d-none');
            showToast('已恢复终端控制', 'success');
            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        } else {
            showToast('教师拒绝了恢复请求', 'error');
        }
        loadMyClusters();
    });

    terminalSocket.on('disconnect', function() {
        terminalConnected = false;
        document.getElementById('terminal-status').textContent = '连接断开';
        setTerminalStatus('terminal-status-error');
    });

    terminalSocket.on('connect_error', function() {
        document.getElementById('terminal-status').textContent = '连接服务器失败';
        setTerminalStatus('terminal-status-error');
    });
}

function initTerminal() {
    if (terminal) {
        terminal.clear();
        return;
    }
    terminal = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: '"Cascadia Code", "Fira Code", "Source Code Pro", Consolas, monospace',
        theme: {
            background: '#1e1e1e',
            foreground: '#d4d4d4',
            cursor: '#d4d4d4',
            cursorAccent: '#1e1e1e',
            selection: 'rgba(255,255,255,0.15)',
            black: '#1e1e1e',
            red: '#f44747',
            green: '#6a9955',
            yellow: '#d7ba7d',
            blue: '#569cd6',
            magenta: '#c586c0',
            cyan: '#4dc9b0',
            white: '#d4d4d4',
            brightBlack: '#808080',
            brightRed: '#f44747',
            brightGreen: '#6a9955',
            brightYellow: '#d7ba7d',
            brightBlue: '#569cd6',
            brightMagenta: '#c586c0',
            brightCyan: '#4dc9b0',
            brightWhite: '#ffffff',
        },
    });
    fitAddon = new FitAddon.FitAddon();
    terminal.loadAddon(fitAddon);
    terminal.open(document.getElementById('terminal-body'));
    fitAddon.fit();

    terminal.onKey(function(e) {
        if (isTakenOver) return;
        if (terminalSocket && terminalSocket.connected) {
            terminalSocket.emit('ssh_data', {data: e.key});
        }
    });
    terminal.textarea.addEventListener('paste', function(e) {
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text');
        if (terminalSocket && terminalSocket.connected && text) {
            terminalSocket.emit('ssh_data', {data: '\x1b[200~' + text + '\x1b[201~'});
        }
    });
    terminal.onResize(function(size) {
        if (terminalSocket && terminalSocket.connected) {
            terminalSocket.emit('ssh_resize', {cols: size.cols, rows: size.rows});
        }
    });
}

function closeTerminal() {
    if (terminalSocket) {
        terminalSocket.disconnect();
    }
    document.getElementById('terminal-overlay').classList.add('d-none');
    terminalConnected = false;
    currentClusterName = null;
    currentSessionId = null;
    isTakenOver = false;
    if (terminal) {
        terminal.dispose();
        terminal = null;
        fitAddon = null;
    }
    if (terminalSocket) {
        terminalSocket = null;
    }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    hideStudentReconnectCountdown();
    loadMyClusters();
}

function toggleTerminalFullscreen() {
    var container = document.getElementById('terminal-container');
    container.classList.toggle('fullscreen');
    setTimeout(function() { fitAddon.fit(); }, 150);
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        var overlay = document.getElementById('terminal-overlay');
        if (overlay && !overlay.classList.contains('d-none')) {
            closeTerminal();
        }
    }
});

document.addEventListener('DOMContentLoaded', loadMyClusters);

function onSessionUpdate(data) {
    loadMyClusters();
}

// ── VM Shutdown Vote event listeners ──
(function() {
    if (typeof stateSocket === 'undefined' || !stateSocket) {
        setTimeout(arguments.callee, 500);
        return;
    }

    stateSocket.on('vm_shutdown_request', function(data) {
        shutdownVoteId = data.vote_id;
        var vtype = data.type || 'single';
        var title, msg;
        if (vtype === 'cluster') {
            title = '\u{1F6A8} 集群关机确认';
            msg = '用户 <strong>' + esc(data.initiator_name) + '</strong> 正在尝试关闭集群 <strong>' + esc(data.cluster_name) + '</strong> 的全部节点。<br>请投票：';
        } else {
            title = '\u26A0\uFE0F 关机确认';
            msg = '用户 <strong>' + esc(data.initiator_name) + '</strong> 正在尝试关机：';
        }
        showShutdownModal(title, msg, true, false, false, vtype, data.vm_name, data.vm_list);
        updateShutdownCountdown(data.remaining || 30);
        if (shutdownVoteTimer) clearInterval(shutdownVoteTimer);
        var remaining = data.remaining || 30;
        shutdownVoteTimer = setInterval(function() {
            remaining--;
            updateShutdownCountdown(Math.max(0, remaining));
            if (remaining <= 0) { clearInterval(shutdownVoteTimer); shutdownVoteTimer = null; }
        }, 1000);
    });
    stateSocket.on('vm_shutdown_pending', function(data) {
        shutdownVoteId = data.vote_id;
        var vtype = data.type || 'single';
        var title, msg;
        if (vtype === 'cluster') {
            title = '\u{1F6A8} 等待确认';
            msg = '正在等待其他同学确认关闭集群 <strong>' + esc(data.cluster_name) + '</strong> 的全部节点...';
        } else {
            title = '\u23F3 等待确认';
            msg = '正在等待其他同学确认关机操作...';
        }
        var agreedEl = document.getElementById('shutdown-vote-agreed-count');
        var totalEl = document.getElementById('shutdown-vote-total-count');
        if (agreedEl) agreedEl.textContent = data.agreed || 1;
        if (totalEl) totalEl.textContent = data.total_voters || 0;
        showShutdownModal(title, msg, false, true, false, vtype, data.vm_name, data.vm_list);
        updateShutdownCountdown(data.remaining || 30);
        if (shutdownVoteTimer) clearInterval(shutdownVoteTimer);
        var remaining = data.remaining || 30;
        shutdownVoteTimer = setInterval(function() {
            remaining--;
            updateShutdownCountdown(Math.max(0, remaining));
            if (remaining <= 0) { clearInterval(shutdownVoteTimer); shutdownVoteTimer = null; }
        }, 1000);
    });
    stateSocket.on('vm_shutdown_countdown', function(data) {
        if (data.vote_id === shutdownVoteId) {
            updateShutdownCountdown(data.remaining);
        }
    });
    stateSocket.on('vm_shutdown_proceed', function(data) {
        hideShutdownModal();
        if (data.type === 'cluster') {
            showToast('所有同学已同意，正在关闭集群全部节点', 'success');
            loadMyClusters();
        } else {
            showToast('所有同学已同意，正在关机', 'success');
            var _key = data.node + '_' + data.vmid;
            vmStatusCache[_key] = 'stopped';
            document.querySelectorAll('[id$="-' + data.vmid + '"]').forEach(function(_el) {
                if (_el.classList.contains('vm-tag')) _el.className = 'vm-tag vm-stopped';
            });
        }
    });
    stateSocket.on('vm_shutdown_cancelled', function(data) {
        hideShutdownModal();
        showToast(data.reason || '关机已取消', 'info');
    });
    stateSocket.on('vm_shutdown_allowed', function(data) {
        hideShutdownModal();
        if (data.type === 'cluster') {
            showToast('集群全部节点已停止', 'success');
            loadMyClusters();
        } else {
            var _key = data.node + '_' + data.vmid;
            vmStatusCache[_key] = 'stopped';
            document.querySelectorAll('[id$="-' + data.vmid + '"]').forEach(function(_el) {
                if (_el.classList.contains('vm-tag')) _el.className = 'vm-tag vm-stopped';
            });
            showToast('已停止', 'success');
        }
    });
    stateSocket.on('vm_shutdown_error', function(data) {
        hideShutdownModal();
        showToast(data.message || '操作失败', 'error');
    });
    stateSocket.on('vm_shutdown_voted', function(data) {
        showShutdownModal('✓ 已投票', '等待其他同学确认...', false, false, true);
    });
})();
</script>
{% endblock %}
