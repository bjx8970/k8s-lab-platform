{% extends "base.html" %}
{% block page_heading %}我的集群{% endblock %}
{% block content %}

<div id="student-clusters-section"></div>

<div id="terminal-overlay" style="display:none">
    <div id="terminal-container">
        <div id="terminal-header">
            <span id="terminal-title">Web终端</span>
            <span id="terminal-status" style="margin-left:12px;font-size:12px;color:#aaa"></span>
            <span id="takeover-indicator" style="margin-left:12px;font-size:12px;color:#faad14;display:none">教师正在操作</span>
            <button id="request-reconnect-btn" onclick="requestReconnectFromTerminal()" style="display:none;padding:4px 12px;border:1px solid #faad14;border-radius:4px;background:#fff7e6;color:#d46b08;font-size:12px;cursor:pointer;font-weight:500;margin-left:8px">请求恢复</button>
            <span id="student-reconnect-countdown" style="display:none;margin-left:8px;font-size:12px;color:#faad14"></span>
            <span style="flex:1"></span>
            <button id="terminal-fullscreen" onclick="toggleTerminalFullscreen()" title="全屏">&#9974;</button>
            <button id="terminal-close" onclick="closeTerminal()" title="断开">&#10005;</button>
        </div>
        <div id="terminal-body"></div>
    </div>
</div>

<style>
.mycluster-item{border:1px solid #f0f0f0;border-radius:8px;padding:14px 16px;margin-bottom:8px}
.mycluster-item .mycluster-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.mycluster-item .mycluster-name{font-size:15px;font-weight:600}
.mycluster-item .mycluster-action-bar{display:flex;align-items:center;gap:12px;margin-top:12px;padding-top:12px;border-top:1px solid #f0f0f0}
.mycluster-item .mycluster-ssh{background:#f6f8fa;border:1px solid #e8eaed;border-radius:6px;padding:10px 14px;margin-top:8px;font-size:13px;line-height:1.8;display:none}
.mycluster-item .mycluster-ssh.show{display:block}
.mycluster-item .mycluster-ssh .ssh-label{color:#666;display:inline-block;min-width:56px}
.mycluster-item .mycluster-ssh code{background:#e8eaed;padding:2px 8px;border-radius:4px;font-family:SFMono-Regular,Consolas,monospace;font-size:13px;color:#d63384}
.view-ssh-btn{padding:4px 12px;border:1px solid #1890ff;border-radius:4px;background:#e6f7ff;color:#1890ff;font-size:12px;cursor:pointer;font-weight:500}
.view-ssh-btn:hover{background:#1890ff;color:#fff}
.mycluster-item .mycluster-vms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.vm-tag{background:#f5f5f5;border:1px solid #d9d9d9;color:#999;border-radius:5px;font-size:12px;padding:3px 8px;display:inline-flex;align-items:center;gap:4px}
.vm-tag.vm-running{background:#e6f7ff;border-color:#1890ff;color:#1890ff}
.vm-tag.vm-stopped{background:#fff2f0;border-color:#ff4d4f;color:#ff4d4f}
.vm-btn{padding:1px 5px;border:1px solid #91d5ff;border-radius:3px;background:#fff;color:#1890ff;font-size:11px;cursor:pointer;line-height:1.2}
.vm-btn:hover{background:#1890ff;color:#fff}
.ssh-btn{padding:8px 24px;border:2px solid #52c41a;border-radius:6px;background:#52c41a;color:#fff;font-size:14px;cursor:pointer;font-weight:600}
.ssh-btn:hover{background:#73d13d;border-color:#73d13d}
.ssh-btn-reconnect{padding:8px 20px;border:2px solid #1890ff;border-radius:6px;background:#1890ff;color:#fff;font-size:14px;cursor:pointer;font-weight:600}
.ssh-btn-reconnect:hover{background:#40a9ff;border-color:#40a9ff}
.ssh-btn-terminate{padding:8px 16px;border:2px solid #ff4d4f;border-radius:6px;background:#fff2f0;color:#ff4d4f;font-size:13px;cursor:pointer;font-weight:600}
.ssh-btn-terminate:hover{background:#ff4d4f;color:#fff}
.ssh-btn-request{padding:4px 12px;border:1px solid #faad14;border-radius:4px;background:#fff7e6;color:#d46b08;font-size:12px;cursor:pointer;font-weight:500}
.ssh-btn-request:hover{background:#faad14;color:#fff}
.ssh-takeover-notice{font-size:12px;color:#faad14;margin-left:8px}

#terminal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:9999;display:flex;align-items:center;justify-content:center}
#terminal-container{width:90%;height:85%;background:#1e1e1e;border-radius:8px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.4)}
#terminal-container.fullscreen{width:100%;height:100%;border-radius:0}
#terminal-header{display:flex;align-items:center;padding:8px 16px;background:#2d2d2d;border-bottom:1px solid #3d3d3d;color:#ccc;font-size:14px;user-select:none}
#terminal-header button{background:none;border:none;color:#ccc;font-size:16px;cursor:pointer;padding:4px 8px;border-radius:3px;margin-left:4px}
#terminal-header button:hover{background:#444;color:#fff}
#terminal-body{flex:1;overflow:hidden;position:relative}
#terminal-body .xterm{padding:8px;height:100%}
</style>

<script src="/static/vendor/socket.io/socket.io.min.js"></script>
<link rel="stylesheet" href="/static/vendor/xterm/xterm.min.css">
<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm/xterm-addon-fit.js"></script>

<script>
var vmStatusCache = {};
var terminalSocket = null;
var terminal = null;
var fitAddon = null;
var currentClusterName = null;
var currentSessionId = null;
var terminalConnected = false;
var isTakenOver = false;
var countdownTimer = null;
var studentCountdownTimer = null;
var clusterSessionStates = {};

function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function vmAction(node, vmid, action) {
    try {
        var r = await fetch('/api/pve/vms/' + encodeURIComponent(node) + '/' + vmid + '/' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
        });
        var d = await r.json();
        if (!r.ok) throw new Error(d.error || '操作失败');
        var _key = node + '_' + vmid;
        var _st = action === 'start' ? 'running' : 'stopped';
        vmStatusCache[_key] = _st;
        document.querySelectorAll('[id$="-' + vmid + '"]').forEach(function(_el) {
            if (_el.classList.contains('vm-tag')) _el.className = 'vm-tag' + (_st === 'running' ? ' vm-running' : ' vm-stopped');
        });
        showToast(action === 'start' ? '已启动' : '已停止', 'success');
    } catch (e) {
        showToast('操作失败: ' + e.message, 'error');
    }
}

async function refreshVmStatuses(clusters) {
    var vmList = [];
    var vmMap = {};
    for (var cname in clusters) {
        var c = clusters[cname];
        if (!c.vms) continue;
        for (var vn in c.vms) {
            var vm = c.vms[vn];
            var el = document.getElementById('vm-' + cname + '-' + vm.vmid);
            if (!el) continue;
            var key = vm.node + '_' + vm.vmid;
            vmList.push({node: vm.node, vmid: vm.vmid});
            vmMap[key] = el;
        }
    }
    if (!vmList.length) return;
    try {
        var res = await fetch('/api/pve/vms/status/batch', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({vms: vmList}),
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'batch failed');
        for (var key in (data.statuses || {})) {
            var st = data.statuses[key];
            var el = vmMap[key];
            vmStatusCache[key] = st.status;
            if (el) el.className = 'vm-tag' + (st.status === 'running' ? ' vm-running' : ' vm-stopped');
        }
    } catch(e) {
        for (var k in vmMap) { vmMap[k].className = 'vm-tag vm-stopped'; }
    }
}

async function loadMyClusters() {
    try {
        var r = await fetch('/api/k8s/clusters');
        var clusters = await r.json();
        await loadSessionStates(clusters);
        renderCards(clusters);
        refreshVmStatuses(clusters);
    } catch (e) {
        document.getElementById('student-clusters-section').innerHTML = '<div class="card"><p style="color:#ff4d4f">加载失败: ' + esc(e.message) + '</p></div>';
    }
}

async function loadSessionStates(clusters) {
    clusterSessionStates = {};
    for (var name in clusters) {
        try {
            var r = await fetch('/api/webssh/cluster/' + encodeURIComponent(name));
            var d = await r.json();
            if (d.has_session) {
                clusterSessionStates[name] = d.session;
            }
        } catch(e) {}
    }
}

function renderCards(clusters) {
    var keys = Object.keys(clusters);
    if (keys.length === 0) {
        document.getElementById('student-clusters-section').innerHTML = '<div class="card"><p style="text-align:center;color:#999;padding:40px 0">暂无集群</p></div>';
        return;
    }

    var grouped = {};
    var classOrder = [];
    for (var ni = 0; ni < keys.length; ni++) {
        var name = keys[ni];
        var c = clusters[name];
        var key = c.class_name || '其他课程';
        if (!grouped[key]) { grouped[key] = []; classOrder.push(key); }
        grouped[key].push({name: name, data: c});
    }

    var html = '';
    for (var ci = 0; ci < classOrder.length; ci++) {
        var clsName = classOrder[ci];
        var items = grouped[clsName];
        html += '<div class="card" style="margin-bottom:16px">' +
            '<h3 style="margin-bottom:12px;font-size:16px">&#128218; ' + esc(clsName) + ' (' + items.length + ' 个集群)</h3>';

        for (var ii = 0; ii < items.length; ii++) {
            var c = items[ii].data;
            var cname = items[ii].name;
            var label = c.group_name || '集群';
            var host = esc('{{ (get_config("openwrt") or {}).get("host", "") }}') + ':' + (c.ssh_port || '');
            var pw = esc(c.password || 'k8s.1234');
            var sshInfo = '<div class="mycluster-ssh" id="ssh-info-' + esc(cname) + '">' +
                '<span class="ssh-label">地址</span> <code>' + host + '</code><br>' +
                '<span class="ssh-label">用户</span> <code>k8s</code><br>' +
                '<span class="ssh-label">密码</span> <code>' + pw + '</code>' +
                '</div>';

            var vmsHtml = '';
            if (c.vms) {
                for (var vn in c.vms) {
                    var v = c.vms[vn];
                    var _key = v.node + '_' + v.vmid;
                    var _cached = vmStatusCache[_key];
                    var _extra = _cached === 'running' ? ' vm-running' : (_cached === 'stopped' ? ' vm-stopped' : '');
                    vmsHtml += '<span class="vm-tag' + _extra + '" id="vm-' + esc(cname) + '-' + v.vmid + '">' +
                        esc(vn) + ' (' + v.role + ')' +
                        '<button class="vm-btn" onclick="event.stopPropagation();vmAction(\'' + esc(v.node) + '\',' + v.vmid + ',\'start\')">&#9654;</button>' +
                        '<button class="vm-btn" onclick="event.stopPropagation();vmAction(\'' + esc(v.node) + '\',' + v.vmid + ',\'stop\')">&#9209;</button>' +
                        '</span>';
                }
            }

            var btnHtml = renderSessionButtons(cname, c);

            html += '<div class="mycluster-item">' +
                '<div class="mycluster-header">' +
                    '<span class="mycluster-name">' + esc(label) + '</span>' +
                '</div>' +
                '<div class="mycluster-action-bar">' +
                    btnHtml +
                    '<button class="view-ssh-btn" onclick="toggleSshInfo(\'' + esc(cname) + '\')">&#128274; 查看连接信息</button>' +
                '</div>' +
                sshInfo +
                (vmsHtml ? '<div class="mycluster-vms">' + vmsHtml + '</div>' : '') +
            '</div>';
        }
        html += '</div>';
    }
    document.getElementById('student-clusters-section').innerHTML = html;
}

function renderSessionButtons(clusterName, clusterData) {
    var session = clusterSessionStates[clusterName];
    if (!session) {
        return '<button class="ssh-btn" onclick="createSession(\'' + esc(clusterName) + '\')">连接</button>';
    }

    if (session.takeover_active) {
        return '<button class="ssh-btn-reconnect" onclick="reconnectSession(\'' + esc(clusterName) + '\')">重新连接</button>' +
               '<span class="ssh-takeover-notice">教师 ' + esc(session.takeover_by ? session.takeover_by.username : '') + ' 正在操作</span>';
    }

    if (session.status === 'terminated') {
        return '<button class="ssh-btn" onclick="createSession(\'' + esc(clusterName) + '\')">连接</button>';
    }

    if (session.status === 'disconnected') {
        return '<button class="ssh-btn-reconnect" onclick="reconnectSession(\'' + esc(clusterName) + '\')">重新连接</button>' +
               '<button class="ssh-btn-terminate" onclick="terminateSession(\'' + esc(clusterName) + '\')">终止会话</button>';
    }

    if (session.status === 'connected') {
        return '<button class="ssh-btn-reconnect" onclick="reconnectSession(\'' + esc(clusterName) + '\')">打开终端</button>' +
               '<button class="ssh-btn-terminate" onclick="terminateSession(\'' + esc(clusterName) + '\')">终止会话</button>';
    }

    return '';
}

function toggleSshInfo(clusterName) {
    var el = document.getElementById('ssh-info-' + clusterName);
    if (!el) return;
    el.classList.toggle('show');
}

async function createSession(clusterName) {
    initTerminal();
    currentClusterName = clusterName;
    document.getElementById('terminal-overlay').style.display = 'flex';
    document.getElementById('terminal-title').textContent = 'Web终端 - ' + clusterName;
    document.getElementById('terminal-status').textContent = '连接中...';
    document.getElementById('terminal-status').style.color = '#ffd591';
    document.getElementById('takeover-indicator').style.display = 'none';
    isTakenOver = false;
    setTimeout(function() { fitAddon.fit(); }, 100);

    if (!terminalSocket) {
        initSocket();
    }

    terminalSocket.emit('session_create', {cluster: clusterName});
}

async function reconnectSession(clusterName) {
    initTerminal();
    currentClusterName = clusterName;
    document.getElementById('terminal-overlay').style.display = 'flex';
    document.getElementById('terminal-title').textContent = 'Web终端 - ' + clusterName;
    document.getElementById('terminal-status').textContent = '重新连接中...';
    document.getElementById('terminal-status').style.color = '#ffd591';
    document.getElementById('takeover-indicator').style.display = 'none';
    isTakenOver = false;
    setTimeout(function() { fitAddon.fit(); }, 100);

    if (!terminalSocket) {
        initSocket();
    }

    terminalSocket.emit('session_reconnect', {cluster: clusterName});
}

async function terminateSession(clusterName) {
    if (!await showConfirm('确定终止该会话？SSH 连接将被关闭。')) return;
    try {
        var r = await fetch('/api/webssh/sessions/' + encodeURIComponent(clusterName) + '/terminate', {
            method: 'POST',
        });
        var d = await r.json();
        if (!r.ok) throw new Error(d.error || '终止失败');
        delete clusterSessionStates[clusterName];
        loadMyClusters();
        showToast('会话已终止', 'success');
    } catch(e) {
        showToast('终止失败: ' + e.message, 'error');
    }
}

async function requestReconnect(sessionId, clusterName) {
    if (!terminalSocket) return;
    terminalSocket.emit('reconnect_request', {session_id: sessionId});
    showToast('已发送恢复请求', 'info');
    showStudentReconnectCountdown();
}

function requestReconnectFromTerminal() {
    if (currentSessionId && currentClusterName && terminalSocket) {
        requestReconnect(currentSessionId, currentClusterName);
    }
}

function showStudentReconnectCountdown() {
    var countdownEl = document.getElementById('student-reconnect-countdown');
    var btn = document.getElementById('request-reconnect-btn');
    if (!countdownEl) return;
    if (btn) btn.style.display = 'none';
    var seconds = 10;
    countdownEl.textContent = '正在请求恢复 (' + seconds + '秒)';
    countdownEl.style.display = '';
    if (studentCountdownTimer) clearInterval(studentCountdownTimer);
    studentCountdownTimer = setInterval(function() {
        seconds--;
        if (seconds > 0) {
            countdownEl.textContent = '正在请求恢复 (' + seconds + '秒)';
        } else if (seconds === 0) {
            countdownEl.textContent = '等待恢复...';
        }
        if (seconds <= 0) {
            clearInterval(studentCountdownTimer);
            studentCountdownTimer = null;
        }
    }, 1000);
}

function hideStudentReconnectCountdown() {
    var countdownEl = document.getElementById('student-reconnect-countdown');
    if (countdownEl) countdownEl.style.display = 'none';
    if (studentCountdownTimer) { clearInterval(studentCountdownTimer); studentCountdownTimer = null; }
}

function initSocket() {
    terminalSocket = io('/webssh', {
        reconnection: true,
        reconnectionAttempts: 3,
        reconnectionDelay: 1000,
    });

    terminalSocket.on('connect', function() {
        if (currentClusterName && currentSessionId) {
            terminalSocket.emit('session_reconnect', {cluster: currentClusterName});
        }
    });

    terminalSocket.on('session_created', function(data) {
        currentSessionId = data.session_id;
        terminalConnected = true;
        document.getElementById('terminal-status').textContent = '已连接';
        document.getElementById('terminal-status').style.color = '#52c41a';
        terminal.writeln('\x1b[32m已连接到 ' + data.cluster + '\x1b[0m\r\n');
    });

    terminalSocket.on('session_reconnected', function(data) {
        currentSessionId = data.session_id;
        terminalConnected = true;
        document.getElementById('terminal-status').textContent = '已连接';
        document.getElementById('terminal-status').style.color = '#52c41a';
    });

    terminalSocket.on('log_replay', function(data) {
        if (terminal && data.lines) {
            terminal.write(data.lines);
        }
    });

    terminalSocket.on('session_terminated', function(data) {
        delete clusterSessionStates[data.cluster];
        if (data.cluster === currentClusterName) {
            terminal.writeln('\r\n\x1b[33m会话已终止\x1b[0m\r\n');
            document.getElementById('terminal-status').textContent = '已终止';
            document.getElementById('terminal-status').style.color = '#ff4d4f';
        }
        loadMyClusters();
    });

    terminalSocket.on('ssh_output', function(data) {
        if (terminal) terminal.write(data.data);
    });

    terminalSocket.on('ssh_error', function(data) {
        terminalConnected = false;
        document.getElementById('terminal-status').textContent = '错误';
        document.getElementById('terminal-status').style.color = '#ff4d4f';
        if (terminal) terminal.writeln('\x1b[31m' + (data.message || '连接失败') + '\x1b[0m\r\n');
    });

    terminalSocket.on('ssh_disconnected', function(data) {
        terminalConnected = false;
        document.getElementById('terminal-status').textContent = '已断开';
        document.getElementById('terminal-status').style.color = '#ff4d4f';
        if (terminal) terminal.writeln('\r\n\x1b[33m' + (data.reason || '连接已断开') + '\x1b[0m\r\n');
    });

    terminalSocket.on('takeover_notify', function(data) {
        isTakenOver = true;
        document.getElementById('takeover-indicator').style.display = '';
        document.getElementById('request-reconnect-btn').style.display = '';
        document.getElementById('takeover-indicator').textContent = '教师 ' + (data.by || '') + ' 正在操作';
        showToast('教师 ' + (data.by || '') + ' 正在操作您的终端', 'warning');
    });

    terminalSocket.on('takeover_released', function() {
        isTakenOver = false;
        document.getElementById('takeover-indicator').style.display = 'none';
        document.getElementById('request-reconnect-btn').style.display = 'none';
        hideStudentReconnectCountdown();
        showToast('教师已释放终端', 'success');
    });

    terminalSocket.on('reconnect_request_notify', function() {
    });

    terminalSocket.on('reconnect_requested', function(data) {
        showStudentReconnectCountdown();
    });

    terminalSocket.on('reconnect_response', function(data) {
        hideStudentReconnectCountdown();
        if (data.accepted) {
            isTakenOver = false;
            document.getElementById('takeover-indicator').style.display = 'none';
            document.getElementById('request-reconnect-btn').style.display = 'none';
            showToast('已恢复终端控制', 'success');
            if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
        } else {
            showToast('教师拒绝了恢复请求', 'error');
        }
        loadMyClusters();
    });

    terminalSocket.on('disconnect', function() {
        terminalConnected = false;
        document.getElementById('terminal-status').textContent = '连接断开';
        document.getElementById('terminal-status').style.color = '#ff4d4f';
    });

    terminalSocket.on('connect_error', function() {
        document.getElementById('terminal-status').textContent = '连接服务器失败';
        document.getElementById('terminal-status').style.color = '#ff4d4f';
    });
}

function initTerminal() {
    if (terminal) {
        terminal.clear();
        return;
    }
    terminal = new Terminal({
        cursorBlink: true,
        fontSize: 14,
        fontFamily: '"Cascadia Code", "Fira Code", "Source Code Pro", Consolas, monospace',
        theme: {
            background: '#1e1e1e',
            foreground: '#d4d4d4',
            cursor: '#d4d4d4',
            cursorAccent: '#1e1e1e',
            selection: 'rgba(255,255,255,0.15)',
            black: '#1e1e1e',
            red: '#f44747',
            green: '#6a9955',
            yellow: '#d7ba7d',
            blue: '#569cd6',
            magenta: '#c586c0',
            cyan: '#4dc9b0',
            white: '#d4d4d4',
            brightBlack: '#808080',
            brightRed: '#f44747',
            brightGreen: '#6a9955',
            brightYellow: '#d7ba7d',
            brightBlue: '#569cd6',
            brightMagenta: '#c586c0',
            brightCyan: '#4dc9b0',
            brightWhite: '#ffffff',
        },
    });
    fitAddon = new FitAddon.FitAddon();
    terminal.loadAddon(fitAddon);
    terminal.open(document.getElementById('terminal-body'));
    fitAddon.fit();

    terminal.onKey(function(e) {
        if (isTakenOver) return;
        if (terminalSocket && terminalSocket.connected) {
            terminalSocket.emit('ssh_data', {data: e.key});
        }
    });
    terminal.element.addEventListener('paste', function(e) {
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text');
        if (terminalSocket && terminalSocket.connected) {
            terminalSocket.emit('ssh_data', {data: text});
        }
    });
    terminal.onResize(function(size) {
        if (terminalSocket && terminalSocket.connected) {
            terminalSocket.emit('ssh_resize', {cols: size.cols, rows: size.rows});
        }
    });
}

function closeTerminal() {
    if (terminalSocket) {
        terminalSocket.disconnect();
    }
    document.getElementById('terminal-overlay').style.display = 'none';
    terminalConnected = false;
    currentClusterName = null;
    currentSessionId = null;
    isTakenOver = false;
    if (terminal) {
        terminal.dispose();
        terminal = null;
        fitAddon = null;
    }
    if (terminalSocket) {
        terminalSocket = null;
    }
    if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    hideStudentReconnectCountdown();
    loadMyClusters();
}

function toggleTerminalFullscreen() {
    var container = document.getElementById('terminal-container');
    container.classList.toggle('fullscreen');
    setTimeout(function() { fitAddon.fit(); }, 150);
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
        var overlay = document.getElementById('terminal-overlay');
        if (overlay && overlay.style.display !== 'none') {
            closeTerminal();
        }
    }
});

document.addEventListener('DOMContentLoaded', loadMyClusters);

function onSessionUpdate(data) {
    loadMyClusters();
}
</script>
{% endblock %}
