<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Lab Platform - 管理后台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; min-height: 100vh; background: #f0f2f5; }
        .sidebar { width: 240px; background: #001529; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; }
        .sidebar-header { padding: 20px; font-size: 18px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,.1); }
        .sidebar-header span { color: #1890ff; }
        .nav { list-style: none; padding: 8px 0; flex: 1; }
        .nav li a { display: flex; align-items: center; gap: 10px; padding: 12px 24px; color: rgba(255,255,255,.65); text-decoration: none; transition: all .2s; font-size: 14px; }
        .nav li a:hover { color: #fff; background: #1890ff; }
        .nav li a.active { color: #fff; background: #1890ff; }
        .nav li a .icon { font-size: 18px; width: 20px; text-align: center; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { background: #fff; padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
        .header h2 { font-size: 16px; font-weight: 500; color: #333; }
        .header .user-info { font-size: 14px; color: #666; }
        .content { padding: 24px; flex: 1; }
        .page-title { font-size: 20px; font-weight: 500; color: #333; margin-bottom: 16px; }
        .card { background: #fff; border-radius: 6px; padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
        .card p { color: #666; font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: #fff; border-radius: 6px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
        .stat-card .label { font-size: 14px; color: #999; }
        .stat-card .value { font-size: 28px; font-weight: 600; color: #333; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">K8s Lab <span>Platform</span></div>
        <ul class="nav">
            <li><a href="/" class="{% if request.path == '/' %}active{% endif %}"><span class="icon">&#9751;</span> 仪表盘</a></li>
            <li><a href="/users" class="{% if request.path == '/users' %}active{% endif %}"><span class="icon">&#128101;</span> 用户管理</a></li>
            <li><a href="/classes" class="{% if request.path == '/classes' %}active{% endif %}"><span class="icon">&#128218;</span> 班级管理</a></li>
            <li><a href="/k8s" class="{% if request.path == '/k8s' %}active{% endif %}"><span class="icon">&#9729;</span> K8s集群管理</a></li>
            <li><a href="/pve" class="{% if request.path == '/pve' %}active{% endif %}"><span class="icon">&#9881;</span> PVE连接管理</a></li>
            <li><a href="/openwrt" class="{% if request.path == '/openwrt' %}active{% endif %}"><span class="icon">&#9729;</span> OpenWrt管理</a></li>
            <li><a href="/db" class="{% if request.path == '/db' %}active{% endif %}"><span class="icon">&#128451;</span> 数据库管理</a></li>
        </ul>
    </div>
    <div class="main">
        <div class="header">
            <h2>{% block page_heading %}仪表盘{% endblock %}</h2>
            <div class="user-info">admin@k8s-lab</div>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
