{% extends "base.html" %}
{% block page_heading %}用户管理{% endblock %}
{% block content %}

{% if g.user.role == 'admin' %}
<div style="margin-bottom:12px">
  <button class="btn btn-primary" onclick="openModal(null)">+ 新增用户</button>
</div>
<div style="margin-bottom:12px">
  <button class="btn btn-sm {% if role_filter == 'teacher' %}btn-active{% endif %}" onclick="switchRole('teacher')">教师</button>
  <button class="btn btn-sm {% if role_filter == 'student' %}btn-active{% endif %}" onclick="switchRole('student')">学生</button>
</div>
{% endif %}

<div id="user-list" style="font-size:14px">加载中...</div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <h3 id="modal-title" style="margin-bottom:16px">新增用户</h3>
    <div class="form-group"><label>用户名 *</label><input id="f-username" class="form-control"></div>
    <div class="form-group"><label>密码 *</label><input id="f-password" class="form-control" type="password"></div>
    {% if g.user.role == 'admin' %}
    <div class="form-group"><label>角色</label>
      <select id="f-role" class="form-control">
        <option value="student">学生</option>
        <option value="teacher">教师</option>
        <option value="admin">管理员</option>
      </select>
    </div>
    {% endif %}
    <div id="form-error" style="color:#ff4d4f;font-size:13px;margin-top:8px;display:none"></div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="btn btn-primary" id="btn-save" onclick="saveUser()">保存</button>
      <button class="btn" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<style>
.btn{display:inline-flex;align-items:center;padding:6px 16px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;color:#333;font-size:13px;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#1890ff;color:#1890ff}
.btn-primary{background:#1890ff;border-color:#1890ff;color:#fff}
.btn-primary:hover{background:#40a9ff;border-color:#40a9ff;color:#fff}
.btn-sm{padding:3px 10px;font-size:12px}
.btn-active{background:#1890ff;border-color:#1890ff;color:#fff}
.btn-danger{color:#ff4d4f;border-color:#ff4d4f}
.btn-danger:hover{background:#ff4d4f;color:#fff}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#333;margin-bottom:4px;font-weight:500}
.form-control{width:100%;padding:6px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;outline:none;transition:border-color .2s;box-sizing:border-box}
.form-control:focus{border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.2)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:13px}
th{color:#999;font-weight:500;font-size:12px;text-transform:uppercase}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.45);z-index:1000;justify-content:center;align-items:flex-start;padding-top:12vh}
.modal-overlay.show{display:flex}
.modal-card{background:#fff;border-radius:8px;padding:28px 32px;width:420px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,0.2);max-height:80vh;overflow-y:auto}
</style>

<script>
const API = '/api/users';
let _editingId = null;
let _roleFilter = '{{ role_filter if role_filter else "student" }}';

function $(id) { return document.getElementById(id); }

function show(el) { (typeof el === 'string' ? $(el) : el).style.display = 'flex'; }
function hide(el) { (typeof el === 'string' ? $(el) : el).style.display = 'none'; }

async function apiReq(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function switchRole(role) {
  _roleFilter = role;
  loadUsers();
}

async function loadUsers() {
  const el = $('user-list');
  el.innerHTML = '加载中...';
  try {
    const users = await apiReq('GET', '?role=' + _roleFilter);
    if (!users.length) { el.innerHTML = '<p style="color:#999;margin-top:12px">暂无用户</p>'; return; }
    let html = '<table><tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th></tr>';
    users.forEach(u => {
      const roleLabel = {'admin':'管理员','teacher':'教师','student':'学生'}[u.role] || u.role;
      html += '<tr>' +
        '<td>' + u.id + '</td>' +
        '<td><strong>' + esc(u.username) + '</strong></td>' +
        '<td>' + roleLabel + '</td>' +
        '<td>' + (u.is_active ? '<span style="color:#52c41a">正常</span>' : '<span style="color:#ff4d4f">禁用</span>') + '</td>' +
        '<td style="color:#999;font-size:12px">' + (u.created_at || '').slice(0, 10) + '</td>' +
        '<td>' +
          '<button class="btn btn-sm" onclick="openEdit(' + u.id + ')">编辑</button> ' +
          '<button class="btn btn-sm btn-danger" onclick="deleteUser(' + u.id + ')">删除</button>' +
        '</td></tr>';
    });
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = '<p style="color:#ff4d4f">加载失败: ' + e.message + '</p>';
  }
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function openModal(user) {
  _editingId = user ? user.id : null;
  $('modal-title').textContent = user ? '编辑用户' : '新增用户';
  $('f-username').value = user ? user.username : '';
  $('f-password').value = '';
  if ($('f-role')) $('f-role').value = user ? user.role : 'student';
  $('form-error').style.display = 'none';
  show('modal-overlay');
}

function openEdit(id) {
  apiReq('GET', '?role=' + _roleFilter).then(users => {
    const u = users.find(x => x.id === id);
    if (u) openModal(u);
  });
}

function closeModal() { hide('modal-overlay'); _editingId = null; }

async function saveUser() {
  const err = $('form-error');
  err.style.display = 'none';
  const username = $('f-username').value.trim();
  const password = $('f-password').value;
  if (!username) { err.textContent = '用户名不能为空'; err.style.display = 'block'; return; }
  if (!_editingId && !password) { err.textContent = '密码不能为空'; err.style.display = 'block'; return; }
  const body = { username };
  if (password) body.password = password;
  if ($('f-role') && !_editingId) body.role = $('f-role').value;
  $('btn-save').disabled = true;
  try {
    if (_editingId) {
      await apiReq('PUT', '/' + _editingId, body);
    } else {
      await apiReq('POST', '', body);
    }
    closeModal();
    loadUsers();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  } finally {
    $('btn-save').disabled = false;
  }
}

async function deleteUser(id) {
  if (!confirm('确定删除此用户？')) return;
  try {
    await apiReq('DELETE', '/' + id);
    loadUsers();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

document.addEventListener('DOMContentLoaded', loadUsers);
</script>
{% endblock %}
