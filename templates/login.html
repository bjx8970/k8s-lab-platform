<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Lab Platform - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --primary: #1890ff; --primary-hover: #40a9ff; --primary-disabled: #91caff; --success: #52c41a; --danger: #ff4d4f; --text: #1d1d1f; --text-secondary: #6e6e73; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #0a1628 0%, #1a365d 50%, #2d4a7a 100%); }
        .login-card { background: #fff; border-radius: 12px; padding: 44px 40px; width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,.2); }
        .login-card h1 { font-size: 22px; text-align: center; margin-bottom: 32px; color: #333; }
        .login-card h1 span { color: var(--primary); }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: var(--text); margin-bottom: 6px; font-weight: 500; }
        .form-control { width: 100%; padding: 10px 14px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 14px; outline: none; transition: border-color .2s, box-shadow .2s; box-sizing: border-box; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(24,144,255,.15); }
        .btn { display: block; width: 100%; padding: 10px 0; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-size: 15px; cursor: pointer; transition: background .2s; font-weight: 500; }
        .btn:hover { background: var(--primary-hover); }
        .btn:disabled { background: var(--primary-disabled); cursor: not-allowed; }
        .error { color: var(--danger); font-size: 13px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>K8s Lab <span>Platform</span></h1>
        <div class="form-group">
            <label>用户名</label>
            <input id="f-username" class="form-control" placeholder="请输入用户名" autocomplete="username">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input id="f-password" class="form-control" type="password" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button class="btn" id="btn-login" onclick="login()">登 录</button>
        <div class="error" id="login-error"></div>
    </div>
    <script>
    async function login() {
        const btn = document.getElementById('btn-login');
        const err = document.getElementById('login-error');
        btn.disabled = true;
        err.style.display = 'none';
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('f-username').value.trim(),
                    password: document.getElementById('f-password').value,
                })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || '登录失败');
            window.location.href = '/';
        } catch (e) {
            err.textContent = e.message;
            err.style.display = 'block';
        } finally {
            btn.disabled = false;
        }
    }
    document.addEventListener('keydown', function(e) { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
