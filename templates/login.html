{% extends "_standalone_base.html" %}
{% block title %}K8s Lab Platform - 登录{% endblock %}
{% block standalone_content %}
<h1>K8s Lab <span>Platform</span></h1>
<div class="form-group">
    <label>用户名</label>
    <input id="f-username" class="form-control" placeholder="请输入用户名" autocomplete="username">
</div>
<div class="form-group">
    <label>密码</label>
    <input id="f-password" class="form-control" type="password" placeholder="请输入密码" autocomplete="current-password">
</div>
<button class="btn" id="btn-login" onclick="login()">登 录</button>
<div class="error" id="login-error"></div>
<script>
async function login() {
    const btn = document.getElementById('btn-login');
    const err = document.getElementById('login-error');
    btn.disabled = true;
    err.style.display = 'none';
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('f-username').value.trim(),
                password: document.getElementById('f-password').value,
            })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '登录失败');
        window.location.href = '/';
    } catch (e) {
        err.textContent = e.message;
        err.style.display = 'block';
    } finally {
        btn.disabled = false;
    }
}
document.addEventListener('keydown', function(e) { if (e.key === 'Enter') login(); });
</script>
{% endblock %}
