{% extends "_standalone_base.html" %}
{% block title %}K8s Lab Platform - 初始化{% endblock %}
{% block standalone_content %}
<h1>欢迎使用 K8s Lab <span>Platform</span></h1>
<div class="desc">首次运行，请创建管理员账号</div>
<div class="form-group">
    <label>管理员用户名</label>
    <input id="f-username" class="form-control" placeholder="admin" autocomplete="username">
</div>
<div class="form-group">
    <label>管理员密码</label>
    <input id="f-password" class="form-control" type="password" placeholder="至少 6 位" autocomplete="new-password">
</div>
<div class="form-group">
    <label>确认密码</label>
    <input id="f-confirm" class="form-control" type="password" placeholder="再次输入密码">
</div>
<button class="btn" id="btn-setup" onclick="setup()">初始化</button>
<div class="error" id="setup-error"></div>
<script>
async function setup() {
    const btn = document.getElementById('btn-setup');
    const err = document.getElementById('setup-error');
    const username = document.getElementById('f-username').value.trim();
    const password = document.getElementById('f-password').value;
    const confirm = document.getElementById('f-confirm').value;
    btn.disabled = true;
    err.style.display = 'none';
    if (!username || !password) { err.textContent = '请填写用户名和密码'; err.style.display = 'block'; btn.disabled = false; return; }
    if (password.length < 6) { err.textContent = '密码长度至少 6 位'; err.style.display = 'block'; btn.disabled = false; return; }
    if (password !== confirm) { err.textContent = '两次密码输入不一致'; err.style.display = 'block'; btn.disabled = false; return; }
    try {
        const res = await fetch('/api/setup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '初始化失败');
        window.location.href = '/';
    } catch (e) {
        err.textContent = e.message;
        err.style.display = 'block';
    } finally {
        btn.disabled = false;
    }
}
document.addEventListener('keydown', function(e) { if (e.key === 'Enter') setup(); });
</script>
{% endblock %}
