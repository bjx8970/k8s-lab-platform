{% extends "base.html" %}
{% block content %}
<div style="max-width:900px;margin:0 auto;padding:20px">
    <h2 style="margin-bottom:8px">集群创建日志</h2>
    <div style="font-size:13px;color:#666;margin-bottom:16px">Task ID: <code id="task-id">{{ task_id }}</code></div>

    <div id="status-badge" style="display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:500;margin-bottom:12px">等待中</div>

    <div class="progress-bar" style="width:100%;height:10px;background:#e8e8e8;border-radius:5px;overflow:hidden;margin-bottom:20px">
        <div id="progress-fill" class="progress-fill" style="width:0%;height:100%;background:#1890ff;border-radius:5px;transition:width .5s ease"></div>
    </div>

    <div id="log-container" style="background:#1e1e1e;color:#d4d4d4;border-radius:6px;padding:12px;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;line-height:1.6;height:500px;overflow-y:auto;white-space:pre-wrap;word-break:break-all"></div>
</div>

<style>
.progress-fill.success{background:#52c41a}
.progress-fill.error{background:#ff4d4f}
#log-container div{margin:0}
#log-container .log-time{color:#888}
#log-container .log-info{color:#d4d4d4}
#log-container .log-warn{color:#dcdcaa}
#log-container .log-done{color:#52c41a;font-weight:500}
#log-container .log-err{color:#f44747}
</style>

<script>
const API = '/api/k8s';
const TASK_ID = '{{ task_id }}';
const logContainer = document.getElementById('log-container');
const progressFill = document.getElementById('progress-fill');
const statusBadge = document.getElementById('status-badge');
let lastLogCount = 0;
let pollTimer = null;

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

function appendLogs(logs) {
    for (let i = lastLogCount; i < logs.length; i++) {
        const entry = logs[i];
        const row = document.createElement('div');
        const time = escapeHtml(entry.time || '');
        const msg = escapeHtml(entry.message || '');
        let cls = 'log-info';
        if (entry.progress >= 100) cls = 'log-done';
        else if (msg.includes('失败') || msg.includes('错误') || msg.includes('error')) cls = 'log-err';
        else if (msg.includes('跳过')) cls = 'log-warn';
        row.innerHTML = '<span class="log-time">[' + time + ']</span> <span class="' + cls + '">' + msg + '</span>';
        logContainer.appendChild(row);
    }
    lastLogCount = logs.length;
    logContainer.scrollTop = logContainer.scrollHeight;
}

function updateStatus(task) {
    const pct = task.progress || 0;
    progressFill.style.width = pct + '%';
    progressFill.className = 'progress-fill';
    if (task.status === 'completed') {
        progressFill.classList.add('success');
        statusBadge.textContent = '✅ 已完成';
        statusBadge.style.background = '#f6ffed';
        statusBadge.style.color = '#52c41a';
    } else if (task.status === 'error') {
        progressFill.classList.add('error');
        statusBadge.textContent = '❌ 失败';
        statusBadge.style.background = '#fff2f0';
        statusBadge.style.color = '#ff4d4f';
    } else {
        statusBadge.textContent = '⏳ 运行中 (' + pct + '%)';
        statusBadge.style.background = '#e6f7ff';
        statusBadge.style.color = '#1890ff';
    }
}

async function poll() {
    try {
        const res = await fetch(API + '/tasks/' + TASK_ID);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        updateStatus(data);
        if (data.logs) appendLogs(data.logs);
        if (data.status === 'completed' || data.status === 'error') {
            return;
        }
        pollTimer = setTimeout(poll, 2000);
    } catch (e) {
        const row = document.createElement('div');
        row.innerHTML = '<span class="log-err">[error] 获取日志失败: ' + escapeHtml(e.message) + '</span>';
        logContainer.appendChild(row);
        pollTimer = setTimeout(poll, 5000);
    }
}

poll();
</script>
{% endblock %}
