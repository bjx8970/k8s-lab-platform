{% extends "base.html" %}
{% block extra_head %}
<link rel="stylesheet" href="/static/css/pages/k8s_logs.css">
{% endblock %}
{% block content %}
<div class="k8s-log-wrapper">
    <h2 class="mb-2">任务日志</h2>
    <div class="text-medium fs-13 mb-4">Task ID: <code id="task-id">{{ task_id }}</code></div>

    <div id="status-badge" class="k8s-log-status-badge mb-3">等待中</div>

    <div class="progress-bar k8s-log-progress">
        <div id="progress-fill" class="progress-fill k8s-log-progress-fill"></div>
    </div>

    <div id="log-container" class="k8s-log-container"></div>
</div>

<style>
.k8s-log-wrapper{max-width:900px;margin:0 auto;padding:20px}
.k8s-log-wrapper h2{margin-bottom:8px}
.k8s-log-status-badge{display:inline-block;padding:3px 10px;border-radius:4px;font-size:12px;font-weight:500}
.k8s-log-progress{width:100%;height:10px;background:#e8e8e8;border-radius:5px;overflow:hidden;margin-bottom:20px}
.k8s-log-progress-fill{width:0%;height:100%;background:#1890ff;border-radius:5px;transition:width .5s ease}
.k8s-log-container{background:#1e1e1e;color:#d4d4d4;border-radius:6px;padding:12px;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;line-height:1.6;height:500px;overflow-y:auto;white-space:pre-wrap;word-break:break-all}
</style>



<script>
const API = '/api/k8s';
const TASK_ID = '{{ task_id }}';
const logContainer = document.getElementById('log-container');
const progressFill = document.getElementById('progress-fill');
const statusBadge = document.getElementById('status-badge');
let lastLogCount = 0;
let pollTimer = null;

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

function appendLogs(logs) {
    for (let i = lastLogCount; i < logs.length; i++) {
        const entry = logs[i];
        const row = document.createElement('div');
        const time = escapeHtml(entry.time || '');
        const msg = escapeHtml(entry.message || '');
        let cls = 'log-info';
        if (entry.progress >= 100) cls = 'log-done';
        else if (msg.includes('失败') || msg.includes('错误') || msg.includes('error')) cls = 'log-err';
        else if (msg.includes('跳过')) cls = 'log-warn';
        row.innerHTML = '<span class="log-time">[' + time + ']</span> <span class="' + cls + '">' + msg + '</span>';
        logContainer.appendChild(row);
    }
    lastLogCount = logs.length;
    logContainer.scrollTop = logContainer.scrollHeight;
}

function updateStatus(task) {
    const queueLabels = {'create': '创建集群', 'deploy': '部署 K8s', 'delete': '删除集群'};
    const label = document.getElementById('task-type-label');
    if (task.queue && queueLabels[task.queue]) {
        label.textContent = queueLabels[task.queue];
    }
    const pct = task.progress || 0;
    progressFill.style.width = pct + '%';
    progressFill.className = 'progress-fill';
    statusBadge.className = 'badge';
    if (task.status === 'completed') {
        progressFill.classList.add('success');
        statusBadge.textContent = '✅ 已完成';
        statusBadge.classList.add('badge-green');
    } else if (task.status === 'error') {
        progressFill.classList.add('error');
        statusBadge.textContent = '❌ 失败';
        statusBadge.classList.add('badge-red');
    } else {
        statusBadge.textContent = '⏳ 运行中 (' + pct + '%)';
        statusBadge.classList.add('badge-blue');
    }
}

async function poll() {
    try {
        const res = await fetch(API + '/tasks/' + TASK_ID);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);
        updateStatus(data);
        if (data.logs) appendLogs(data.logs);
        if (data.status === 'completed' || data.status === 'error') {
            return;
        }
        pollTimer = setTimeout(poll, 2000);
    } catch (e) {
        const row = document.createElement('div');
        row.innerHTML = '<span class="log-err">[error] 获取日志失败: ' + escapeHtml(e.message) + '</span>';
        logContainer.appendChild(row);
        pollTimer = setTimeout(poll, 5000);
    }
}

poll();
</script>
{% endblock %}
