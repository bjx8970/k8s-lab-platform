{% extends "base.html" %}
{% block page_heading %}宿主机管理{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="/static/css/pages/pve.css">
{% endblock %}
{% block content %}

<div class="mb-4">
    <button class="btn btn-primary" onclick="openAddModal()">+ 新增服务器</button>
</div>

<div id="server-list"></div>

<div class="modal-overlay" id="modal-overlay">
    <div class="modal-card">
        <h3 id="modal-title" class="mb-4">新增宿主机</h3>
        <div class="form-grid-2">
            <div class="form-group">
                <label>命名 *</label>
                <input id="f-name" class="form-control" placeholder="如: 机房A">
            </div>
            <div class="form-group">
                <label>服务器 IP *</label>
                <input id="f-host" class="form-control" placeholder="192.168.1.100">
            </div>
            <div class="form-group">
                <label>端口</label>
                <input id="f-port" class="form-control" type="number" value="8006">
            </div>
            <div class="form-group">
                <label>用户 *</label>
                <input id="f-user" class="form-control" placeholder="root@pam">
            </div>
            <div class="form-group">
                <label>API Name *</label>
                <input id="f-token-name" class="form-control" placeholder="my-token">
            </div>
            <div class="form-group">
                <label>API Token *</label>
                <input id="f-token-value" class="form-control" type="password" placeholder="xxxxxxxx-xxxx-...">
            </div>
            <div class="form-group">
                <label>节点名 *</label>
                <input id="f-node" class="form-control" placeholder="pve1">
            </div>
            <div class="form-group">
                <label>模板 VMID</label>
                <input id="f-template-vmid" class="form-control" type="number" value="9000">
            </div>
            <div class="form-group">
                <label>OpenWrt IP</label>
                <input id="f-ow-host" class="form-control" placeholder="192.168.1.1">
            </div>
            <div class="form-group">
                <label>OpenWrt 端口</label>
                <input id="f-ow-port" class="form-control" type="number" value="22">
            </div>
            <div class="form-group">
                <label>OpenWrt 用户</label>
                <input id="f-ow-username" class="form-control" placeholder="root">
            </div>
            <div class="form-group">
                <label>OpenWrt 密码</label>
                <input id="f-ow-password" class="form-control" type="password" placeholder="password">
            </div>
        </div>
        <div id="form-error" class="text-danger fs-13 mt-2 d-none"></div>
        <div class="toolbar mt-4">
            <button class="btn btn-primary" id="btn-save" onclick="saveServer()">保存</button>
            <button class="btn" onclick="closeModal()">取消</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="node-modal-overlay">
    <div class="modal-card" style="width:640px">
        <h3 class="mb-4">PVE 节点列表</h3>
        <div id="node-list-content" class="fs-13" style="max-height:400px;overflow-y:auto"></div>
        <div class="mt-3">
            <button class="btn" onclick="closeNodeModal()">关闭</button>
        </div>
    </div>
</div>



<script>
const API = '/api/pve';
let _editingId = null;

function $(id) { return document.getElementById(id); }

function show(el) { if (typeof el === 'string') el = $(el); el.style.display = 'flex'; }
function hide(el) { if (typeof el === 'string') el = $(el); el.style.display = 'none'; }

async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
}

async function loadServers() {
    const el = $('server-list');
    el.innerHTML = '加载中...';
    try {
        const servers = await api('GET', '/servers');
        if (!servers.length) {
            el.innerHTML = '<p class="text-gray fs-14">暂无宿主机，请点击上方按钮添加</p>';
            return;
        }
        el.innerHTML = servers.map(s => renderCard(s)).join('');
    } catch (e) {
        el.innerHTML = '<p class="text-danger">加载失败: ' + e.message + '</p>';
    }
}

function renderCard(s) {
    return '<div class="server-card" id="card-' + s.id + '">' +
        '<div class="row">' +
            '<div class="info">' +
                '<div class="name">' + esc(s.name) + '</div>' +
                '<div class="meta">' +
                    '<span>IP: ' + esc(s.host) + '</span>' +
                    '<span>端口: ' + s.port + '</span>' +
                    '<span>用户: ' + esc(s.user) + '</span>' +
                    '<span>Token: ' + esc(s.token_name) + '</span>' +
                    '<span>节点: ' + esc(s.node) + '</span>' +
                    (s.ow_host ? '<span>OpenWrt: ' + esc(s.ow_host) + '</span>' : '') +
                '</div>' +
                '<div id="status-' + s.id + '"></div>' +
                '<div id="ow-status-' + s.id + '"></div>' +
            '</div>' +
            '<div class="actions">' +
                '<button class="btn btn-sm" onclick="testServer(' + s.id + ')">测试PVE</button>' +
                (s.ow_host ? '<button class="btn btn-sm" onclick="testOpenWrt(' + s.id + ')">测试OpenWrt</button>' : '') +
                '<button class="btn btn-sm" onclick="viewNodes(' + s.id + ')">查看节点</button>' +
                '<button class="btn btn-sm" onclick="openEditModal(' + s.id + ')">编辑</button>' +
                '<button class="btn btn-sm btn-danger" onclick="deleteServer(' + s.id + ')">删除</button>' +
            '</div>' +
        '</div>' +
    '</div>';
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function testServer(id) {
    const el = $('status-' + id);
    el.innerHTML = '测试中...';
    el.className = '';
    try {
        const data = await api('POST', '/servers/' + id + '/test');
        el.innerHTML = '✅ ' + (data.version ? '版本: ' + (data.version.version || JSON.stringify(data.version)) : data.message);
        el.className = 'conn-ok';
    } catch (e) {
        el.innerHTML = '❌ ' + e.message;
        el.className = 'conn-err';
    }
}

async function testOpenWrt(id) {
    const el = $('ow-status-' + id);
    el.innerHTML = '测试中...';
    el.className = '';
    try {
        const data = await api('POST', '/servers/' + id + '/test-openwrt');
        el.innerHTML = '✅ ' + (data.version ? (data.version.version || JSON.stringify(data.version)) : data.message);
        el.className = 'conn-ok';
    } catch (e) {
        el.innerHTML = '❌ ' + e.message;
        el.className = 'conn-err';
    }
}

async function viewNodes(id) {
    const overlay = $('node-modal-overlay');
    const content = $('node-list-content');
    content.innerHTML = '加载中...';
    show(overlay);
    try {
        const nodes = await api('GET', '/servers/' + id + '/nodes');
        if (!nodes.length) {
            content.innerHTML = '<p class="text-gray">暂无节点</p>';
            return;
        }
        content.innerHTML = nodes.map(n =>
            '<div class="pve-node-row">' +
                '<strong>' + esc(n.node) + '</strong>' +
                '<span class="text-gray ml-3">状态: ' + (n.status || '?') + '</span>' +
                '<span class="text-gray ml-3">CPU: ' + (n.cpu || '?') + '</span>' +
                '<span class="text-gray ml-3">内存: ' + (n.mem ? Math.round(n.mem/1024/1024/1024) + 'GB' : '?') + '</span>' +
            '</div>'
        ).join('');
    } catch (e) {
        content.innerHTML = '<p class="text-danger">获取节点失败: ' + e.message + '</p>';
    }
}

function closeNodeModal() { hide('node-modal-overlay'); }

function openAddModal() {
    _editingId = null;
    $('modal-title').textContent = '新增宿主机';
    $('f-name').value = '';
    $('f-host').value = '';
    $('f-port').value = '8006';
    $('f-user').value = '';
    $('f-token-name').value = '';
    $('f-token-value').value = '';
    $('f-node').value = '';
    $('f-template-vmid').value = '9000';
    $('f-ow-host').value = '';
    $('f-ow-port').value = '22';
    $('f-ow-username').value = '';
    $('f-ow-password').value = '';
    $('form-error').style.display = 'none';
    $('btn-save').textContent = '保存';
    show('modal-overlay');
}

async function openEditModal(id) {
    _editingId = id;
    $('modal-title').textContent = '编辑宿主机';
    $('btn-save').textContent = '保存';
    $('form-error').style.display = 'none';
    show('modal-overlay');
    $('f-name').value = '';
    $('f-host').value = '';
    $('f-port').value = '8006';
    $('f-user').value = '';
    $('f-token-name').value = '';
    $('f-token-value').value = '';
    $('f-node').value = '';
    $('f-template-vmid').value = '9000';
    $('f-ow-host').value = '';
    $('f-ow-port').value = '22';
    $('f-ow-username').value = '';
    $('f-ow-password').value = '';
    try {
        const servers = await api('GET', '/servers');
        const s = servers.find(x => x.id === id);
        if (!s) { throw new Error('服务器不存在'); }
        $('f-name').value = s.name;
        $('f-host').value = s.host;
        $('f-port').value = s.port;
        $('f-user').value = s.user;
        $('f-token-name').value = s.token_name;
        $('f-token-value').value = '[REDACTED]';
        $('f-node').value = s.node;
        $('f-template-vmid').value = s.template_vmid || 9000;
        $('f-ow-host').value = s.ow_host || '';
        $('f-ow-port').value = s.ow_port || 22;
        $('f-ow-username').value = s.ow_username || '';
        $('f-ow-password').value = '[REDACTED]';
    } catch (e) {
        $('form-error').textContent = '加载失败: ' + e.message;
        $('form-error').style.display = 'block';
    }
}

function closeModal() { hide('modal-overlay'); _editingId = null; }

function getFormData() {
    return {
        name: $('f-name').value.trim(),
        host: $('f-host').value.trim(),
        port: parseInt($('f-port').value) || 8006,
        user: $('f-user').value.trim(),
        token_name: $('f-token-name').value.trim(),
        token_value: $('f-token-value').value,
        node: $('f-node').value.trim(),
        template_vmid: parseInt($('f-template-vmid').value) || 9000,
        ow_host: $('f-ow-host').value.trim(),
        ow_port: parseInt($('f-ow-port').value) || 22,
        ow_username: $('f-ow-username').value.trim(),
        ow_password: $('f-ow-password').value,
    };
}

async function saveServer() {
    const data = getFormData();
    const errEl = $('form-error');
    errEl.style.display = 'none';
    const missing = [];
    if (!data.name) missing.push('命名');
    if (!data.host) missing.push('服务器 IP');
    if (!data.user) missing.push('用户');
    if (!data.token_name) missing.push('API Name');
    if (!_editingId && (!data.token_value || data.token_value === '****' || data.token_value === '[REDACTED]')) missing.push('API Token');
    if (!data.node) missing.push('节点名');
    if (!data.ow_host) missing.push('OpenWrt IP');
    if (!data.ow_username) missing.push('OpenWrt 用户');
    if (!_editingId && (!data.ow_password || data.ow_password === '****' || data.ow_password === '[REDACTED]')) missing.push('OpenWrt 密码');
    if (missing.length) {
        errEl.textContent = '请填写必填项: ' + missing.join(', ');
        errEl.style.display = 'block';
        return;
    }
    $('btn-save').disabled = true;
    try {
        if (_editingId) {
            await api('PUT', '/servers/' + _editingId, data);
        } else {
            await api('POST', '/servers', data);
        }
        closeModal();
        loadServers();
    } catch (e) {
        errEl.textContent = '保存失败: ' + e.message;
        errEl.style.display = 'block';
    } finally {
        $('btn-save').disabled = false;
    }
}

async function deleteServer(id) {
    if (!await showConfirm('确定删除此宿主机？关联的 OpenWrt 配置也将一并删除。')) return;
    try {
        await api('DELETE', '/servers/' + id);
        loadServers();
    } catch (e) {
        showToast('删除失败: ' + e.message, 'error');
    }
}

document.addEventListener('DOMContentLoaded', loadServers);
</script>
{% endblock %}
