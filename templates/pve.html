{% extends "base.html" %}
{% block page_heading %}PVE连接管理{% endblock %}
{% block content %}

<div class="card" style="margin-bottom:16px;max-width:720px">
    <h3 style="margin-bottom:16px">PVE连接配置</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
            <label>Host *</label>
            <input id="cfg-host" class="form-control" placeholder="192.168.1.100" value="{{ config.get('host','') }}">
        </div>
        <div class="form-group">
            <label>Port</label>
            <input id="cfg-port" class="form-control" type="number" value="{{ config.get('port',8006) }}">
        </div>
        <div class="form-group">
            <label>User *</label>
            <input id="cfg-user" class="form-control" placeholder="root@pam" value="{{ config.get('user','') }}">
        </div>
        <div class="form-group">
            <label>API Token Name</label>
            <input id="cfg-token-name" class="form-control" placeholder="my-token" value="{{ config.get('token_name','') }}">
        </div>
        <div class="form-group">
            <label>API Token Value</label>
            <input id="cfg-token-value" class="form-control" type="password" placeholder="xxxxxxxx-xxxx-..." value="{{ config.get('token_value','') }}">
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:8px;padding-top:6px">
            <input id="cfg-ssl" type="checkbox" {% if config.get('verify_ssl') %}checked{% endif %}>
            <label for="cfg-ssl" style="margin:0">Verify SSL</label>
        </div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;align-items:center">
        <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
        <button class="btn" onclick="testConnection()">测试连接</button>
    </div>
    <div id="conn-result" style="margin-top:10px;font-size:14px"></div>
</div>

<style>
.btn{display:inline-flex;align-items:center;padding:6px 16px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;color:#333;font-size:13px;cursor:pointer;transition:all .2s}
.btn:hover{border-color:#1890ff;color:#1890ff}
.btn-primary{background:#1890ff;border-color:#1890ff;color:#fff}
.btn-primary:hover{background:#40a9ff;border-color:#40a9ff;color:#fff}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:#333;margin-bottom:4px;font-weight:500}
.form-control{width:100%;padding:6px 10px;border:1px solid #d9d9d9;border-radius:4px;font-size:13px;outline:none;transition:border-color .2s;box-sizing:border-box}
.form-control:focus{border-color:#1890ff;box-shadow:0 0 0 2px rgba(24,144,255,.2)}
</style>

<script>
const API_BASE = '/api/pve';

function $(id) { return document.getElementById(id); }

async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API_BASE + path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
}

function getConfig() {
    return {
        host: $('cfg-host').value.trim(),
        port: parseInt($('cfg-port').value) || 8006,
        user: $('cfg-user').value.trim(),
        token_name: $('cfg-token-name').value.trim(),
        token_value: $('cfg-token-value').value,
        verify_ssl: $('cfg-ssl').checked,
    };
}

async function saveConfig() {
    const el = $('conn-result');
    el.innerHTML = '保存中...';
    el.style.color = '#666';
    try {
        const cfg = getConfig();
        if (!cfg.host || !cfg.user || !cfg.token_name || !cfg.token_value) {
            throw new Error('host、user、token_name、token_value 均为必填项');
        }
        await api('POST', '/config', cfg);
        el.innerHTML = '✅ 配置已保存';
        el.style.color = '#52c41a';
    } catch (e) {
        el.innerHTML = '❌ ' + e.message;
        el.style.color = '#ff4d4f';
    }
}

async function testConnection() {
    const el = $('conn-result');
    el.innerHTML = '测试中...';
    el.style.color = '#666';
    try {
        const cfg = getConfig();
        const data = await api('POST', '/test', cfg);
        el.innerHTML = '✅ ' + data.message;
        el.style.color = '#52c41a';
    } catch (e) {
        el.innerHTML = '❌ ' + e.message;
        el.style.color = '#ff4d4f';
    }
}
</script>
{% endblock %}
