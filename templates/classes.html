{% extends "base.html" %}
{% block page_heading %}课程管理{% endblock %}
{% block content %}

<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">
  <button class="btn btn-primary" onclick="openClassModal(null)">+ 新增课程</button>
  <button class="btn" onclick="downloadClassTemplate()">下载模板</button>
  <button class="btn" onclick="document.getElementById('import-file').click()" style="margin-left:4px">导入</button>
  <input type="file" id="import-file" accept=".csv" style="display:none" onchange="importClasses(this)">
</div>

<div id="class-list" style="font-size:14px">加载中...</div>

<div class="modal-overlay" id="class-modal">
  <div class="modal-card">
    <h3 id="class-modal-title" style="margin-bottom:16px">新增课程</h3>
    <div class="form-group"><label>课程名称 *</label><input id="f-class-name" class="form-control"></div>
    <div class="form-group"><label>描述</label><input id="f-class-desc" class="form-control"></div>
    <div id="class-form-error" style="color:#ff4d4f;font-size:13px;margin-top:8px;display:none"></div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="btn btn-primary" id="btn-save-class" onclick="saveClass()">保存</button>
      <button class="btn" onclick="closeClassModal()">取消</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="group-modal">
  <div class="modal-card">
    <h3 style="margin-bottom:16px">新增组</h3>
    <div class="form-group"><label>组名称 *</label><input id="f-group-name" class="form-control"></div>
    <div id="group-form-error" style="color:#ff4d4f;font-size:13px;margin-top:8px;display:none"></div>
    <div style="margin-top:14px;display:flex;gap:8px">
      <button class="btn btn-primary" id="btn-save-group" onclick="saveGroup()">保存</button>
      <button class="btn" onclick="closeGroupModal()">取消</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="member-modal">
  <div class="modal-card" style="width:520px">
    <h3 id="member-modal-title" style="margin-bottom:16px">管理成员</h3>
    <div id="member-list" style="margin-bottom:12px;font-size:13px"></div>
    <div style="display:flex;gap:8px">
      <input id="f-add-user" class="form-control" placeholder="输入学生用户名添加" style="flex:1">
      <button class="btn btn-primary btn-sm" onclick="addMember()">添加</button>
    </div>
    <div id="member-msg" style="margin-top:8px;font-size:13px;color:#ff4d4f"></div>
    <div style="margin-top:12px"><button class="btn" onclick="closeMemberModal()">关闭</button></div>
  </div>
</div>

<style>
.class-card{border:1px solid #f0f0f0;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--card-shadow);border-left:4px solid var(--primary)}
.class-card .class-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.class-card .class-header .name{font-size:15px;font-weight:600;color:#333}
.class-card .class-header .meta{font-size:12px;color:#999}
.class-card .class-body{padding-top:10px;margin-top:10px;border-top:1px solid #f0f0f0}
.group-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#fafafa;border-radius:6px;margin-bottom:6px;font-size:13px;transition:background .15s}
.group-item:hover{background:#f0f5ff}
.group-item .group-name{font-weight:500}
.group-item .group-actions{display:flex;gap:6px}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;background:#e6f7ff;color:#1890ff}
</style>

<script>
let _editingClassId = null;
let _currentGroupClassId = null;
let _currentGroupId = null;

function $(id) { return document.getElementById(id); }
function show(el) { (typeof el === 'string' ? $(el) : el).style.display = 'flex'; }
function hide(el) { (typeof el === 'string' ? $(el) : el).style.display = 'none'; }

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path.startsWith('/') ? path : '/api/' + path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadClasses() {
  const el = $('class-list');
  el.innerHTML = '加载中...';
  try {
    const classes = await api('GET', 'classes');
    if (!classes.length) { el.innerHTML = '<p style="color:#999;margin-top:12px">暂无课程</p>'; return; }
    const classIds = classes.map(c => c.id);
    const groupsByClass = classIds.length ? await api('GET', '/api/classes/groups?class_ids=' + classIds.join(',')) : {};
    let html = '';
    for (const c of classes) {
      const groups = groupsByClass[c.id] || [];
      html += '<div class="class-card" data-id="' + c.id + '">' +
        '<div class="class-header" onclick="toggleClass(this)">' +
          '<div><span class="name">' + esc(c.name) + '</span> <span class="meta">' + (c.description || '') + '</span></div>' +
          '<div style="display:flex;align-items:center;gap:8px">' +
            '<span class="badge">' + (groups ? groups.length : 0) + ' 组</span>' +
            '<button class="btn btn-sm" onclick="event.stopPropagation();openGroupModal(' + c.id + ')">+ 添加组</button>' +
            '<button class="btn btn-sm btn-danger" onclick="event.stopPropagation();deleteClass(' + c.id + ')">删除</button>' +
          '</div>' +
        '</div>' +
        '<div class="class-body" style="display:none">' +
          renderGroups(groups || []) +
        '</div></div>';
    }
    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = '<p style="color:#ff4d4f">加载失败: ' + e.message + '</p>';
  }
}

function renderGroups(groups) {
  if (!groups.length) return '<p style="color:#999;font-size:13px">暂无组</p>';
  return groups.map(g =>
    '<div class="group-item">' +
      '<div><span class="group-name">' + esc(g.name) + '</span> <span class="badge">' + (g.member_count || 0) + ' 人</span></div>' +
      '<div class="group-actions">' +
        '<button class="btn btn-sm" onclick="openMemberModal(' + g.id + ')">成员</button>' +
        '<button class="btn btn-sm btn-danger" onclick="deleteGroup(' + g.id + ')">删除</button>' +
      '</div>' +
    '</div>'
  ).join('');
}

function toggleClass(el) {
  const body = el.parentElement.querySelector('.class-body');
  body.style.display = body.style.display === 'none' ? 'block' : 'none';
}

// ── Class CRUD ──

function openClassModal(cls) {
  _editingClassId = cls ? cls.id : null;
  $('class-modal-title').textContent = cls ? '编辑课程' : '新增课程';
  $('f-class-name').value = cls ? cls.name : '';
  $('f-class-desc').value = cls ? (cls.description || '') : '';
  $('class-form-error').style.display = 'none';
  show('class-modal');
}

function closeClassModal() { hide('class-modal'); _editingClassId = null; }

async function saveClass() {
  const name = $('f-class-name').value.trim();
  const desc = $('f-class-desc').value.trim();
  const err = $('class-form-error');
  if (!name) { err.textContent = '课程名称不能为空'; err.style.display = 'block'; return; }
  try {
    if (_editingClassId) {
      await api('PUT', 'classes/' + _editingClassId, { name, description: desc });
    } else {
      await api('POST', 'classes', { name, description: desc });
    }
    closeClassModal();
    loadClasses();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}

async function deleteClass(id) {
  if (!confirm('确定删除此课程及其所有组？')) return;
  try {
    await api('DELETE', 'classes/' + id);
    loadClasses();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

// ── Group CRUD ──

function openGroupModal(classId) {
  _currentGroupClassId = classId;
  $('f-group-name').value = '';
  $('group-form-error').style.display = 'none';
  show('group-modal');
}

function closeGroupModal() { hide('group-modal'); _currentGroupClassId = null; }

async function saveGroup() {
  const name = $('f-group-name').value.trim();
  const err = $('group-form-error');
  if (!name) { err.textContent = '组名称不能为空'; err.style.display = 'block'; return; }
  try {
    await api('POST', 'groups', { name, class_id: _currentGroupClassId });
    closeGroupModal();
    loadClasses();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}

async function deleteGroup(id) {
  if (!confirm('确定删除此组？')) return;
  try {
    await api('DELETE', 'groups/' + id);
    loadClasses();
  } catch (e) {
    alert('删除失败: ' + e.message);
  }
}

// ── Members ──

async function openMemberModal(groupId) {
  _currentGroupId = groupId;
  $('f-add-user').value = '';
  $('member-msg').textContent = '';
  show('member-modal');
  await loadMembers(groupId);
}

function closeMemberModal() { hide('member-modal'); _currentGroupId = null; }

async function loadMembers(groupId) {
  const el = $('member-list');
  el.innerHTML = '加载中...';
  try {
    const members = await api('GET', 'groups/' + groupId + '/members');
    if (!members.length) { el.innerHTML = '<p style="color:#999">暂无成员</p>'; return; }
    el.innerHTML = members.map(m =>
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f5f5f5">' +
        '<span>' + esc(m.username) + ' <span class="badge">' + (m.role || '') + '</span></span>' +
        '<button class="btn btn-sm btn-danger" onclick="removeMember(' + m.id + ')">移除</button>' +
      '</div>'
    ).join('');
  } catch (e) {
    el.innerHTML = '<p style="color:#ff4d4f">' + e.message + '</p>';
  }
}

async function addMember() {
  const username = $('f-add-user').value.trim();
  const msg = $('member-msg');
  if (!username) { msg.textContent = '请输入用户名'; return; }
  try {
    const users = await api('GET', '/api/users?role=student');
    const user = users.find(u => u.username === username);
    if (!user) { msg.textContent = '未找到学生: ' + username; return; }
    await api('POST', 'groups/' + _currentGroupId + '/members', { user_id: user.id });
    $('f-add-user').value = '';
    msg.textContent = '✅ 已添加 ' + username;
    msg.style.color = '#52c41a';
    await loadMembers(_currentGroupId);
  } catch (e) {
    msg.textContent = e.message;
    msg.style.color = '#ff4d4f';
  }
}

async function removeMember(userId) {
  if (!confirm('确定移除此成员？')) return;
  try {
    await api('DELETE', 'groups/' + _currentGroupId + '/members/' + userId);
    await loadMembers(_currentGroupId);
  } catch (e) {
    $('member-msg').textContent = e.message;
  }
}

function downloadClassTemplate() {
  window.location.href = '/api/classes/template';
}

async function importClasses(input) {
  const file = input.files[0];
  if (!file) return;
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch('/api/classes/import', { method: 'POST', body: formData });
    const result = await res.json();
    if (!res.ok) throw new Error(result.error || '导入失败');
    let msg = '✅ 成功添加 ' + result.created + ' 个成员';
    if (result.skipped) msg += '，跳过 ' + result.skipped + ' 个（已存在）';
    if (result.errors.length) {
      msg += '\n⚠️ ' + result.errors.length + ' 个错误：\n' + result.errors.slice(0, 5).join('\n');
    }
    alert(msg);
    loadClasses();
  } catch (e) {
    alert('导入失败: ' + e.message);
  }
  input.value = '';
}

document.addEventListener('DOMContentLoaded', loadClasses);
</script>
{% endblock %}
