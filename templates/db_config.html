{% extends "base.html" %}
{% block page_heading %}数据库管理{% endblock %}
{% block content %}

<div class="card" style="margin-bottom:16px">
    <h3>当前状态</h3>
    <div id="db-status" style="font-size:14px;color:#666;margin-top:8px">加载中...</div>
</div>

<div class="card">
    <h3>数据库配置</h3>
    <p style="font-size:13px;color:#999;margin-bottom:12px;margin-top:4px">修改配置后自动重新初始化，无需重启应用</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
            <label>主机地址 *</label>
            <input id="f-host" class="form-control" placeholder="127.0.0.1">
        </div>
        <div class="form-group">
            <label>端口</label>
            <input id="f-port" class="form-control" type="number" value="5432">
        </div>
        <div class="form-group">
            <label>用户名 *</label>
            <input id="f-user" class="form-control" placeholder="postgres">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input id="f-password" class="form-control" type="password">
        </div>
        <div class="form-group" style="grid-column:1/-1">
            <label>数据库名 *</label>
            <input id="f-database" class="form-control" placeholder="k8s_lab">
        </div>
    </div>
    <div id="form-error" style="color:#ff4d4f;font-size:13px;margin-top:8px;display:none"></div>
    <div style="margin-top:12px;display:flex;gap:8px">
        <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
        <button class="btn" id="btn-test" onclick="testConnection()">测试连接</button>
    </div>
    <div id="test-result" style="margin-top:8px;font-size:13px"></div>
    <div id="save-result" style="margin-top:8px;font-size:13px;display:none"></div>
</div>

<script>
const API = '/api/db';
function $(id) { return document.getElementById(id); }

async function load() {
    try {
        const r = await fetch(API + '/config');
        const data = await r.json();
        const cfg = data.config || {};
        $('f-host').value = cfg.host || '';
        $('f-port').value = cfg.port || 5432;
        $('f-user').value = cfg.user || '';
        $('f-database').value = cfg.database || '';
        if (cfg.password) $('f-password').value = '****';
    } catch(e) {}

    try {
        const r = await fetch(API + '/status');
        const s = await r.json();
        var html = '类型: <strong>PostgreSQL</strong> | ' +
            '状态: <strong style="color:' + (s.connected ? '#52c41a' : '#ff4d4f') + '">' +
            (s.connected ? '已连接' : '连接失败') + '</strong> | ' +
            '集群数: <strong>' + (s.cluster_count || 0) + '</strong>';
        if (s.host) html += ' | ' + s.host + '/' + s.database;
        $('db-status').innerHTML = html;
    } catch(e) {}
}

async function saveConfig() {
    var cfg = {
        type: 'postgresql',
        host: $('f-host').value.trim(),
        port: parseInt($('f-port').value) || 5432,
        user: $('f-user').value.trim(),
        password: $('f-password').value,
        database: $('f-database').value.trim(),
    };
    if (!cfg.host || !cfg.user || !cfg.database) {
        $('form-error').textContent = '请填写主机地址、用户名和数据库名';
        $('form-error').style.display = 'block';
        return;
    }
    try {
        var r = await fetch(API + '/config', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(cfg)
        });
        var data = await r.json();
        if (!r.ok) throw new Error(data.error || '保存失败');
        $('form-error').style.display = 'none';
        var el = $('save-result');
        el.style.color = '#52c41a';
        el.textContent = data.message;
        el.style.display = 'block';
        setTimeout(function(){ el.style.display = 'none'; }, 3000);
        load();
    } catch(e) {
        $('form-error').textContent = e.message;
        $('form-error').style.display = 'block';
    }
}

async function testConnection() {
    var el = $('test-result');
    el.style.color = '#666';
    el.textContent = '测试中...';
    try {
        var r = await fetch(API + '/test', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                host: $('f-host').value.trim(),
                port: parseInt($('f-port').value) || 5432,
                user: $('f-user').value.trim(),
                password: $('f-password').value,
                database: $('f-database').value.trim() || 'postgres',
            })
        });
        var data = await r.json();
        if (!r.ok) throw new Error(data.error || '失败');
        el.style.color = '#52c41a';
        el.textContent = '连接成功，版本: ' + data.version;
    } catch(e) {
        el.style.color = '#ff4d4f';
        el.textContent = '' + e.message;
    }
}

document.addEventListener('DOMContentLoaded', load);
</script>
{% endblock %}
