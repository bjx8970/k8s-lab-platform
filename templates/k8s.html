{% extends "base.html" %}
{% block page_heading %}K8s集群管理{% endblock %}
{% block content %}

{% if g.user.role in ('admin', 'teacher') %}
<div style="margin-bottom:16px">
    <button class="btn btn-primary" onclick="openCreateForm()">+ 新建集群</button>
</div>
{% endif %}

<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="margin:0">集群列表</h3>
        <button class="btn btn-sm" onclick="loadClusters()">🔄 刷新状态</button>
    </div>
    <div id="cluster-list" style="font-size:14px">加载中...</div>
</div>

<div id="toast-container" style="position:fixed;top:70px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px"></div>

<div class="modal-overlay" id="key-modal">
    <div class="modal-card" style="width:600px">
        <h3 style="margin-bottom:12px">SSH 密钥</h3>
        <div style="font-size:13px">
            <label style="font-weight:500;display:block;margin-bottom:4px">私钥：</label>
            <textarea id="key-private" readonly style="width:100%;height:180px;font-family:monospace;font-size:12px;padding:8px;border:1px solid #d9d9d9;border-radius:4px;background:#f5f5f5"></textarea>
            <label style="font-weight:500;display:block;margin:8px 0 4px">公钥：</label>
            <textarea id="key-public" readonly style="width:100%;height:60px;font-family:monospace;font-size:12px;padding:8px;border:1px solid #d9d9d9;border-radius:4px;background:#f5f5f5"></textarea>
        </div>
        <div style="margin-top:12px"><button class="btn" onclick="closeKeyModal()">关闭</button></div>
    </div>
</div>

<div class="modal-overlay" id="create-form-modal">
    <div class="modal-card" style="width:640px;max-width:95vw">
        <h3 style="margin-bottom:16px">新建集群</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div class="form-group"><label>PVE 服务器</label><select id="form-server" class="form-control"><option value="">-- 请选择 --</option></select></div>
            <div class="form-group"><label>主节点数量</label><input id="form-master-count" class="form-control" type="number" value="1" min="1"></div>
            <div class="form-group"><label>子节点数量</label><input id="form-node-count" class="form-control" type="number" value="1" min="0"></div>
            <div class="form-group"><label>主节点 CPU 核心</label><input id="form-master-cores" class="form-control" type="number" value="4"></div>
            <div class="form-group"><label>主节点内存 (MB)</label><input id="form-master-mem" class="form-control" type="number" value="4096"></div>
            <div class="form-group"><label>子节点 CPU 核心</label><input id="form-node-cores" class="form-control" type="number" value="4"></div>
            <div class="form-group"><label>子节点内存 (MB)</label><input id="form-node-mem" class="form-control" type="number" value="4096"></div>
            <div class="form-group" style="grid-column:1/-1"><label>client 密码</label><input id="form-password" class="form-control" type="text" value="k8s.1234"></div>
            {% if g.user.role == 'teacher' %}
            <div class="form-group"><label>课程</label><select id="form-class" class="form-control"><option value="">-- 请选择 --</option></select></div>
            <div class="form-group" style="grid-column:1/-1"><label>组（不选 = 演示集群，勾选多个用于批量创建）</label><div id="form-group-container" class="checkbox-group"></div></div>
            {% endif %}
        </div>
        <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn btn-primary" id="btn-create" onclick="createCluster()">创建集群</button>
            {% if g.user.role == 'teacher' %}
            <button class="btn" id="btn-batch" onclick="batchCreate()">批量创建</button>
            {% endif %}
            <button class="btn" onclick="closeCreateForm()" style="margin-left:auto">取消</button>
        </div>
        <div id="create-result" style="margin-top:10px;font-size:14px"></div>
    </div>
</div>

<style>
.checkbox-group{border:1px solid #d9d9d9;border-radius:4px;padding:8px 12px;max-height:180px;overflow-y:auto;background:#fff}
.checkbox-group label{display:flex;align-items:center;gap:6px;margin-bottom:4px;cursor:pointer;font-weight:400;font-size:13px}
.checkbox-group label:last-child{margin-bottom:0}
.cluster-item{border:1px solid #f0f0f0;border-radius:10px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--border);box-shadow:var(--card-shadow);transition:box-shadow .2s}
.cluster-item:hover{box-shadow:var(--shadow-lg)}
.cluster-header{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.cluster-vms{display:flex;gap:6px;flex-wrap:wrap}
.vm-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:#e6f7ff;border:1px solid #91d5ff;border-radius:5px;font-size:12px;color:#1890ff}
.vm-tag.vm-running{background:#e6f7ff;border-color:#1890ff;color:#1890ff}
.vm-tag.vm-stopped{background:#fff2f0;border-color:#ff4d4f;color:#ff4d4f}
.vm-btn{padding:1px 6px;border:1px solid #91d5ff;border-radius:3px;background:#fff;color:#1890ff;font-size:11px;cursor:pointer;line-height:1.2}
.vm-btn:hover{background:#1890ff;color:#fff}
.k8s-badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:12px;font-weight:500}
.k8s-pending{background:#fff7e6;border:1px solid #ffd591;color:#d46b08}
.k8s-installing{background:#e6f7ff;border:1px solid #91d5ff;color:#1890ff}
.k8s-installed{background:#f6ffed;border:1px solid #b7eb8f;color:#52c41a}
.k8s-failed{background:#fff2f0;border:1px solid #ffccc7;color:#ff4d4f}
</style>

<script>
const API = '/api/k8s';
const USER_ROLE = '{{ g.user.role }}';
const OPENWRT_HOST = '{{ (get_config("openwrt") or {}).get("host", "") }}';

let _forceDeleteName = '';

function $(id) { return document.getElementById(id); }

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function statusLabel(status) {
    return {'pending': '未部署', 'installing': '部署中', 'installed': '已部署', 'failed': '部署失败'}[status] || '未部署';
}

async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
}

function showToast(msg, type) {
    type = type || 'info';
    var c = document.getElementById('toast-container');
    var t = document.createElement('div');
    t.style.cssText = 'padding:10px 16px;border-radius:6px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.12);background:#fff;border-left:4px solid ' + (type === 'success' ? '#52c41a' : type === 'error' ? '#ff4d4f' : '#1890ff') + ';animation:fadeIn .3s;max-width:360px';
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(function() { if (t.parentNode) t.parentNode.removeChild(t); }, 300); }, 3000);
}
var styleToast = document.createElement('style');
styleToast.textContent = '@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}';
document.head.appendChild(styleToast);

async function loadClusters() {
    const el = $('cluster-list');
    try {
        const clusters = await api('GET', '/clusters');
        const entries = Object.entries(clusters);
        if (!entries.length) { el.innerHTML = '<p style="color:#999">暂无集群</p>'; return; }
        const isAdminTeacher = USER_ROLE === 'admin' || USER_ROLE === 'teacher';
        const isStudent = USER_ROLE === 'student';
        let html = '';
        for (const [name, c] of entries) {
            const k8sStatus = c.k8s_status || 'pending';
            let headerBtns = '';
            if (isAdminTeacher) {
                headerBtns += '<button class="btn btn-sm" onclick="clusterVmAction(\'' + esc(name) + '\',\'start\')">▶ 启动全部</button>';
                headerBtns += '<button class="btn btn-sm" onclick="clusterVmAction(\'' + esc(name) + '\',\'stop\')">⏹ 停止全部</button>';
                if (k8sStatus !== 'installed' && k8sStatus !== 'installing') {
                    headerBtns += '<button class="btn btn-sm" onclick="deployK8s(\'' + esc(name) + '\')">部署 K8s</button>';
                }
                headerBtns += '<button class="btn btn-sm btn-danger" onclick="deleteCluster(event, \'' + esc(name) + '\')">删除</button>';
            }
            let vmsHtml = '';
            if (c.vms) {
                for (const [vmName, vmInfo] of Object.entries(c.vms)) {
                    vmsHtml += '<span class="vm-tag" id="vm-' + esc(name) + '-' + vmInfo.vmid + '">' +
                        esc(vmName) + ' (VMID ' + vmInfo.vmid + ')' +
                        (isAdminTeacher || isStudent
                            ? '<button class="vm-btn" onclick="vmAction(\'' + esc(vmInfo.node) + '\',' + vmInfo.vmid + ',\'start\')">▶</button>' +
                              '<button class="vm-btn" onclick="vmAction(\'' + esc(vmInfo.node) + '\',' + vmInfo.vmid + ',\'stop\')">⏹</button>'
                            : '') +
                    '</span>';
                }
            }
            let sshLine = 'SSH: <code>' + esc(OPENWRT_HOST) + ':' + (c.ssh_port || '') + '</code> &nbsp;|&nbsp; 用户: <code>k8s</code> &nbsp;|&nbsp; 密码: <code>' + esc(c.password || 'k8s.1234') + '</code>';
            if (isStudent) {
                sshLine += '&nbsp;|&nbsp; <button class="btn btn-sm" onclick="showSshKey(\'' + esc(name) + '\')">查看 SSH 密钥</button>';
            }
            html += '<div class="cluster-item">' +
                '<div class="cluster-header">' +
                    '<strong style="font-size:15px">' + esc(isStudent && c.class_name ? c.class_name : name) + '</strong>' +
                    '<span style="color:#999;font-size:13px">VLAN ' + (c.vlan_id || '') + ' / ' + (c.gateway || '') + '/24</span>' +
                    '<span class="k8s-badge k8s-' + k8sStatus + '">' + statusLabel(k8sStatus) + '</span>' +
                    headerBtns +
                '</div>' +
                '<div class="cluster-vms">' + vmsHtml + '</div>' +
                '<div style="margin-top:8px;font-size:12px;color:#666">' + sshLine + '</div>' +
            '</div>';
        }
        el.innerHTML = html;
        refreshVmStatuses(clusters);
    } catch (e) {
        el.innerHTML = '<p style="color:#ff4d4f">加载失败: ' + e.message + '</p>';
    }
}

async function refreshVmStatuses(clusters) {
    const vmList = [];
    const vmMap = {};
    for (const [name, c] of Object.entries(clusters)) {
        if (!c.vms) continue;
        for (const [, vm] of Object.entries(c.vms)) {
            const el = document.getElementById('vm-' + name + '-' + vm.vmid);
            if (!el) continue;
            const key = vm.node + '_' + vm.vmid;
            vmList.push({node: vm.node, vmid: vm.vmid});
            vmMap[key] = el;
        }
    }
    if (!vmList.length) return;
    try {
        const res = await fetch('/api/pve/vms/status/batch', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({vms: vmList}),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'batch failed');
        for (const [key, st] of Object.entries(data.statuses || {})) {
            const el = vmMap[key];
            if (el) el.className = 'vm-tag' + (st.status === 'running' ? ' vm-running' : ' vm-stopped');
        }
    } catch {
        for (const el of Object.values(vmMap)) el.className = 'vm-tag vm-stopped';
    }
}

async function createCluster() {
    closeCreateForm();
    $('btn-create').disabled = true;
    $('create-result').innerHTML = '';
    try {
        const sel = $('form-server');
        const opt = sel.options[sel.selectedIndex];
        const pve_node = (opt && opt.dataset && opt.dataset.node) || '';
        const body = {
            pve_server_id: parseInt($('form-server').value) || 0,
            pve_node: pve_node,
            master_count: parseInt($('form-master-count').value) || 1,
            node_count: parseInt($('form-node-count').value) || 1,
            master_cores: parseInt($('form-master-cores').value) || 4,
            master_memory: parseInt($('form-master-mem').value) || 4096,
            node_cores: parseInt($('form-node-cores').value) || 4,
            node_memory: parseInt($('form-node-mem').value) || 4096,
            password: $('form-password').value.trim() || 'k8s.1234',
            {% if g.user.role == 'teacher' %}
            group_id: (function(){
                const c = document.querySelectorAll('#form-group-container input[type=checkbox]:checked');
                return c.length ? parseInt(c[0].value) : null;
            })(),
            class_id: parseInt($('form-class').value) || null,
            {% endif %}
        };
        if (!body.pve_node) throw new Error('请选择 PVE 服务器');
        await api('POST', '/create', body);
        showToast('✅ 创建任务已提交，可在右上角查看进度', 'success');
        loadClusters();
    } catch (e) {
        showToast('❌ 创建失败: ' + e.message, 'error');
    } finally {
        $('btn-create').disabled = false;
    }
}

async function batchCreate() {
    closeCreateForm();
    const selected = Array.from(
        document.querySelectorAll('#form-group-container input[type=checkbox]:checked')
    ).map(cb => parseInt(cb.value));
    if (!selected.length) {
        alert('请至少勾选一个组，或不选组直接点"创建集群"创建演示集群');
        return;
    }
    $('btn-batch').disabled = true;
    $('create-result').innerHTML = '';
    try {
        const sel = $('form-server');
        const opt = sel.options[sel.selectedIndex];
        const pve_node = (opt && opt.dataset && opt.dataset.node) || '';
        const result = await api('POST', '/batch-create', {
            group_ids: selected.filter(x => x),
            class_id: parseInt($('form-class').value) || null,
            pve_server_id: parseInt($('form-server').value) || 0,
            pve_node: pve_node,
            master_count: parseInt($('form-master-count').value) || 1,
            node_count: parseInt($('form-node-count').value) || 1,
            master_cores: parseInt($('form-master-cores').value) || 4,
            master_memory: parseInt($('form-master-mem').value) || 4096,
            node_cores: parseInt($('form-node-cores').value) || 4,
            node_memory: parseInt($('form-node-mem').value) || 4096,
            password: $('form-password').value.trim() || 'k8s.1234',
        });
        showToast('✅ 已提交 ' + (result.count || selected.length) + ' 个创建任务，可在右上角查看进度', 'success');
        loadClusters();
    } catch (e) {
        showToast('❌ 批量创建失败: ' + e.message, 'error');
    } finally {
        $('btn-batch').disabled = false;
    }
}

function openCreateForm() {
    $('create-form-modal').className = 'modal-overlay show';
}

function closeCreateForm() {
    $('create-form-modal').className = 'modal-overlay';
    $('btn-create').disabled = false;
    if ($('btn-batch')) $('btn-batch').disabled = false;
}

async function clusterVmAction(name, action) {
    const msg = action === 'start' ? '启动' : '停止';
    if (!confirm('确定' + msg + '集群 ' + name + ' 的所有虚拟机？')) return;
    try {
        const res = await fetch('/api/k8s/clusters/' + encodeURIComponent(name) + '/vm-action-all', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '操作失败');
        alert(msg + '完成: ' + data.message);
        loadClusters();
    } catch (e) {
        alert(msg + '失败: ' + e.message);
    }
}

async function deployK8s(name) {
    try {
        await api('POST', '/clusters/' + encodeURIComponent(name) + '/deploy');
        showToast('✅ 部署任务已提交，可在右上角查看进度', 'success');
        loadClusters();
    } catch (e) {
        showToast('❌ 部署失败: ' + e.message, 'error');
    }
}

async function deleteCluster(event, name) {
    if (!confirm('确定删除集群 ' + name + ' ？\n这将释放所有虚拟机并清理 OpenWrt 配置。')) return;
    var btn = event && event.target;
    if (btn) { btn.disabled = true; btn.textContent = '删除中...'; }
    _forceDeleteName = name;
    try {
        await api('DELETE', '/clusters/' + encodeURIComponent(name));
        showToast('✅ 删除任务已提交，可在右上角查看进度', 'success');
        loadClusters();
    } catch (e) {
        showToast('❌ 删除失败: ' + e.message, 'error');
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '删除'; }
    }
}

async function forceDeleteCluster() {
    if (!_forceDeleteName) return;
    if (!confirm('确定强制删除集群 ' + _forceDeleteName + ' ？\n此操作将仅删除数据库记录，不会清理 PVE/OpenWrt 资源。')) return;
    try {
        const res = await fetch(API + '/clusters/' + encodeURIComponent(_forceDeleteName) + '/force', { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        alert('强制删除成功');
        location.reload();
    } catch (e) {
        alert('强制删除失败: ' + e.message);
    }
}

async function vmAction(node, vmid, action) {
    try {
        const res = await fetch('/api/pve/vms/' + encodeURIComponent(node) + '/' + vmid + '/' + action, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}',
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '操作失败');
        alert(action === 'start' ? '已启动' : '已停止');
    } catch (e) {
        alert('操作失败: ' + e.message);
    }
}

async function showSshKey(name) {
    try {
        const data = await api('GET', '/clusters/' + encodeURIComponent(name) + '/ssh-key');
        $('key-private').value = data.private_key || '(无)';
        $('key-public').value = data.public_key || '(无)';
        $('key-modal').className = 'modal-overlay show';
    } catch (e) {
        alert('获取密钥失败: ' + e.message);
    }
}

function closeKeyModal() {
    $('key-modal').className = 'modal-overlay';
}

async function loadPVEServers() {
    try {
        const res = await fetch('/api/pve/servers');
        const servers = await res.json();
        const sel = $('form-server');
        servers.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.id;
            opt.textContent = s.name + ' (' + s.host + ')';
            opt.dataset.node = s.node || '';
            sel.appendChild(opt);
        });
    } catch (e) {
        console.warn('加载 PVE 服务器列表失败:', e);
    }
}

{% if g.user.role == 'teacher' %}
async function loadClasses() {
    try {
        const res = await fetch('/api/classes');
        const classes = await res.json();
        const classSel = $('form-class');
        classes.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.id;
            opt.textContent = c.name;
            classSel.appendChild(opt);
        });
    } catch (e) { console.warn('加载课程列表失败:', e); }
}

async function loadGroups() {
    const classId = $('form-class').value;
    const container = $('form-group-container');
    container.innerHTML = '';
    if (!classId) return;
    try {
        const res = await fetch('/api/classes/' + classId + '/groups');
        const groups = await res.json();
        groups.forEach(g => {
            const label = document.createElement('label');
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.value = g.group_id || g.id;
            label.appendChild(cb);
            label.appendChild(document.createTextNode(g.group_name || g.name));
            container.appendChild(label);
        });
    } catch (e) { console.warn('加载组列表失败:', e); }
}
{% endif %}

document.addEventListener('DOMContentLoaded', async function() {
    const tasks = [loadPVEServers(), loadClusters()];
    {% if g.user.role == 'teacher' %}
    tasks.push(loadClasses());
    if ($('form-class')) $('form-class').addEventListener('change', loadGroups);
    {% endif %}
    await Promise.all(tasks);
});
</script>
{% endblock %}
