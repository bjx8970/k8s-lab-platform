{% extends "base.html" %}
{% block page_heading %}OpenWrt管理{% endblock %}
{% block content %}

<div class="card" style="margin-bottom:16px;max-width:720px">
    <h3 style="margin-bottom:16px">SSH连接配置</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group"><label>Host *</label><input id="cfg-host" class="form-control" value="{{ config.get('host','') }}"></div>
        <div class="form-group"><label>Port</label><input id="cfg-port" class="form-control" type="number" value="{{ config.get('port',22) }}"></div>
        <div class="form-group"><label>Username *</label><input id="cfg-username" class="form-control" value="{{ config.get('username','') }}"></div>
        <div class="form-group"><label>Password *</label><input id="cfg-password" class="form-control" type="password" value="{{ config.get('password','') }}"></div>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px">
        <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
        <button class="btn" onclick="testConnection()">测试连接</button>
    </div>
    <div id="conn-result" style="margin-top:10px;font-size:14px"></div>
</div>

<script>
const API = '/api/openwrt';

function $(id) { return document.getElementById(id); }

async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Request failed');
    return data;
}

function getConfig() {
    return {
        host: $('cfg-host').value.trim(),
        port: parseInt($('cfg-port').value) || 22,
        username: $('cfg-username').value.trim(),
        password: $('cfg-password').value,
    };
}

async function saveConfig() {
    const el = $('conn-result');
    el.innerHTML = '保存中...';
    el.style.color = '#666';
    try {
        const cfg = getConfig();
        if (!cfg.host || !cfg.username || !cfg.password) throw new Error('host、username、password 均为必填项');
        await api('POST', '/config', cfg);
        el.innerHTML = '✅ 配置已保存';
        el.style.color = '#52c41a';
    } catch (e) { el.innerHTML = '❌ ' + e.message; el.style.color = '#ff4d4f'; }
}

async function testConnection() {
    const el = $('conn-result');
    el.innerHTML = '测试中...';
    el.style.color = '#666';
    try {
        const data = await api('POST', '/test', getConfig());
        el.innerHTML = '✅ ' + data.message;
        el.style.color = '#52c41a';
    } catch (e) { el.innerHTML = '❌ ' + e.message; el.style.color = '#ff4d4f'; }
}
</script>
{% endblock %}
