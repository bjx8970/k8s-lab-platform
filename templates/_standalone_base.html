<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}K8s Lab Platform{% endblock %}</title>
    <style>
        :root {
          --primary: #1890ff; --primary-hover: #40a9ff; --primary-disabled: #91caff;
          --success: #52c41a; --danger: #ff4d4f; --warning: #faad14;
          --text: #1d1d1f; --text-secondary: #6e6e73; --text-muted: #aeaeb2;
          --border: #e5e5ea; --bg: #f5f5f7;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          display:flex; justify-content:center; align-items:center;
          min-height:100vh;
          background:linear-gradient(135deg, #0a1628 0%, #1a365d 50%, #2d4a7a 100%);
        }
        .standalone-card {
          background:#fff; border-radius:12px; padding:40px 36px;
          width:420px; max-width:90vw;
          box-shadow:0 8px 40px rgba(0,0,0,.2);
          animation:fadeIn .3s ease;
        }
        .standalone-card h1 {
          font-size:21px; text-align:center; margin-bottom:8px; color:var(--text);
        }
        .standalone-card h1 span { color:var(--primary); }
        .standalone-card .desc {
          font-size:13px; color:var(--text-muted); text-align:center; margin-bottom:24px;
        }
        .form-group { margin-bottom:18px; }
        .form-group label { display:block; font-size:14px; color:var(--text); margin-bottom:6px; font-weight:500; }
        .form-control {
          width:100%; padding:9px 12px;
          border:1px solid var(--border); border-radius:6px;
          font-size:14px; outline:none;
          transition:border-color .2s, box-shadow .2s;
          box-sizing:border-box;
        }
        .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(24,144,255,.15); }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .btn {
          display:block; width:100%;
          padding:9px 0; border:none; border-radius:6px;
          background:var(--primary); color:#fff;
          font-size:15px; cursor:pointer;
          transition:background .2s; font-weight:500;
        }
        .btn:hover { background:var(--primary-hover); }
        .btn:disabled { background:var(--primary-disabled); cursor:not-allowed; }
        .error { color:var(--danger); font-size:13px; margin-top:10px; text-align:center; display:none; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
    </style>
    <script>
    (function () {
        const originalFetch = window.fetch.bind(window);
        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
        const protectedMethods = new Set(['POST', 'PUT', 'PATCH', 'DELETE']);

        window.fetch = function (input, init) {
            let target;
            try {
                target = new URL(input instanceof Request ? input.url : String(input), window.location.href);
            } catch (error) {
                return originalFetch(input, init);
            }

            const method = String(
                (init && init.method) || (input instanceof Request ? input.method : 'GET')
            ).toUpperCase();
            if (target.origin !== window.location.origin || !protectedMethods.has(method)) {
                return originalFetch(input, init);
            }

            const headers = new Headers(
                (init && init.headers) || (input instanceof Request ? input.headers : undefined)
            );
            if (!headers.has('X-CSRFToken')) {
                headers.set('X-CSRFToken', csrfToken);
            }
            return originalFetch(input, Object.assign({}, init || {}, {headers: headers}));
        };
    })();
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="standalone-card">
        {% block standalone_content %}{% endblock %}
    </div>
</body>
</html>
