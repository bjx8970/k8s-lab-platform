name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/issue-3-resource-executor
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python, Node and PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: k8s_lab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d k8s_lab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      K8S_LAB_TEST_POSTGRES_URL: postgresql+pg8000://postgres:ci-test-password@127.0.0.1:5432/k8s_lab_test
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all tests without skips
        run: python scripts/run_ci_tests.py
